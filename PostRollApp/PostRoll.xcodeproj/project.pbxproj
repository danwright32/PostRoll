			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\nPLIST=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\n# SRCROOT is the PostRollApp folder, so its parent is the checkout.\n# Resolved here rather than stored with a `..` still in it.\nROOT=\"$(cd \"${SRCROOT}/..\" && pwd)\"\n/usr/libexec/PlistBuddy -c \"Delete :POSTROLLProjectRoot\" \"${PLIST}\" >/dev/null 2>&1 || true\n/usr/libexec/PlistBuddy -c \"Add :POSTROLLProjectRoot string ${ROOT}\" \"${PLIST}\"\n# Read it back. A write that silently did nothing is what this whole\n# change exists to stop, so the build fails rather than shipping an\n# app that cannot find its own code.\nWROTE=\"$(/usr/libexec/PlistBuddy -c \"Print :POSTROLLProjectRoot\" \"${PLIST}\")\"\nif [ \"${WROTE}\" != \"${ROOT}\" ]; then\n  echo \"error: the checkout path was not recorded into ${PLIST}.\" >&2\n  echo \"error: wanted ${ROOT}, read back \\\"${WROTE}\\\".\" >&2\n  exit 1\nfi\n# The URL scheme an OmniFocus task note links to (#840). Downbeat\n# writes a postroll:// link into the note; macOS only knows which\n# bundle answers it from CFBundleURLTypes in the BUILT plist.\n#\n# Written here rather than as an `INFOPLIST_KEY_` setting for exactly\n# the reason the key above is: Xcode maps that prefix onto a known set\n# of Info.plist keys, and CFBundleURLTypes is not one of them, so the\n# setting would sit in this file looking correct and reach no build.\n#\n# In THIS phase rather than one of its own so there is a single point\n# that edits the finished plist, a single ordering edge against\n# `ProcessInfoPlistFile`, and a single re-seal below covering both\n# edits. A second phase would need its own copy of all three.\n# One spelling of the scheme in this script, which is also the one the\n# guard in tests/test_url_scheme_registered.py reads and holds Swift's\n# `DeepLink.scheme` to.\nPOSTROLL_SCHEME=\"postroll\"\n# The abstract name for the URL type, taken from the plist rather than\n# from `PRODUCT_BUNDLE_IDENTIFIER`. That variable is exported by\n# Xcode and by nothing else, so under `set -u` it takes the whole\n# phase down anywhere the phase is run outside a build, which is where\n# its own tests run it.\nURL_TYPE_NAME=\"$(/usr/libexec/PlistBuddy -c \"Print :CFBundleIdentifier\" \"${PLIST}\")\"\n/usr/libexec/PlistBuddy -c \"Delete :CFBundleURLTypes\" \"${PLIST}\" >/dev/null 2>&1 || true\n/usr/libexec/PlistBuddy \\\n  -c \"Add :CFBundleURLTypes array\" \\\n  -c \"Add :CFBundleURLTypes:0:CFBundleURLName string ${URL_TYPE_NAME}\" \\\n  -c \"Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor\" \\\n  -c \"Add :CFBundleURLTypes:0:CFBundleURLSchemes array\" \\\n  -c \"Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string ${POSTROLL_SCHEME}\" \\\n  \"${PLIST}\"\n# Read back, like the key above and for the same reason: a PlistBuddy\n# write that did nothing says nothing, and the symptom here would be a\n# green build whose link opens no application at all.\nWROTE_SCHEME=\"$(/usr/libexec/PlistBuddy -c \"Print :CFBundleURLTypes:0:CFBundleURLSchemes:0\" \"${PLIST}\")\"\nif [ \"${WROTE_SCHEME}\" != \"${POSTROLL_SCHEME}\" ]; then\n  echo \"error: the ${POSTROLL_SCHEME}:// scheme was not registered in ${PLIST}.\" >&2\n  echo \"error: wanted ${POSTROLL_SCHEME}, read back \\\"${WROTE_SCHEME}\\\".\" >&2\n  exit 1\nfi\n# Changing the Info.plist can break the bundle's seal, so it is\n# signed again here and the signature verified. An unsigned or broken\n# bundle has no stable identity for macOS to remember folder\n# permission grants against, which is what #83 fixed and what this\n# would quietly undo.\n#\n# This used to say the phase runs AFTER Xcode signs. It does not, in\n# either configuration on Xcode 26: the ordering measured on this\n# toolchain is this phase, then `CodeSign`, so the plist edit breaks\n# no seal and Xcode seals the edited file itself. The re-sign is kept\n# anyway. It is correct under the ordering the old comment described,\n# harmless under the one that holds now, and its verification is what\n# caught #719. A signing step is not deleted on the strength of one\n# machine's phase order.\n#\n# Nested code is signed FIRST, and that is not tidiness: codesign\n# REFUSES to seal a bundle containing unsigned nested code, so\n# without this every Debug build of the app scheme died right here\n# with \"code object is not signed at all\" (#719). Release has no\n# nested code, which is why only Debug ever hit it and why nothing\n# this project routinely runs noticed.\n#\n# What to sign is discovered by reading the bundle, never listed by\n# name. Xcode does export EXECUTABLE_DEBUG_DYLIB_PATH and\n# EXECUTABLE_BLANK_INJECTION_DYLIB_PATH, and naming those two would\n# work today; a hand-kept list is exempt from the very check meant to\n# catch it the moment a build grows a third (L96). The issue that\n# reported this knew about PostRoll.debug.dylib and had never heard\n# of __preview.dylib.\n#\n# Skipped when the build was told not to sign at all, which is how\n# build-install.sh builds: it signs the installed copy itself.\nif [ \"${CODE_SIGNING_ALLOWED:-YES}\" = \"YES\" ]; then\n  IDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY:--}\"\n  BUNDLE=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\"\n  MAIN=\"${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}\"\n  MACHO=0\n  # Newline-only IFS so a build directory with a space in it survives.\n  OLD_IFS=\"${IFS}\"\n  IFS=\"$(printf '\\n_')\" && IFS=\"${IFS%_}\"\n  for FOUND in $(/usr/bin/find \"${BUNDLE}\" -type f -print); do\n    # `case` rather than `file ... | grep -q`, because under pipefail\n    # a short-circuiting reader can fail the pipeline by killing its\n    # producer, and that would read as \"not Mach-O\" and silently skip\n    # a file that had to be signed (L183).\n    case \"$(/usr/bin/file -b \"${FOUND}\")\" in\n      Mach-O*) ;;\n      *) continue ;;\n    esac\n    MACHO=$((MACHO + 1))\n    [ \"${FOUND}\" = \"${MAIN}\" ] && continue\n    if ! codesign --force --sign \"${IDENTITY}\" \"${FOUND}\"; then\n      echo \"error: could not sign nested code at ${FOUND}.\" >&2\n      echo \"error: this is the 'Record the checkout this build was made from' script phase, not Xcode's own signing step.\" >&2\n      exit 1\n    fi\n  done\n  IFS=\"${OLD_IFS}\"\n  # A sweep that matched NOTHING is not a bundle with nothing to\n  # sign: every bundle has at least its main executable, so finding\n  # none means the search itself is broken and its silence would\n  # read as success (L100, L98).\n  if [ \"${MACHO}\" -eq 0 ]; then\n    echo \"error: no Mach-O file was found anywhere in ${BUNDLE}, not even ${MAIN}.\" >&2\n    echo \"error: the nested-code sweep in the 'Record the checkout this build was made from' phase is matching nothing, so nothing was signed.\" >&2\n    exit 1\n  fi\n  if ! codesign --force --sign \"${IDENTITY}\" \"${BUNDLE}\"; then\n    echo \"error: could not seal ${BUNDLE} after recording the checkout path.\" >&2\n    echo \"error: this is the 'Record the checkout this build was made from' script phase, not Xcode's own signing step.\" >&2\n    exit 1\n  fi\n  if ! codesign --verify --strict \"${BUNDLE}\"; then\n    echo \"error: ${BUNDLE} does not verify after the 'Record the checkout this build was made from' phase re-signed it.\" >&2\n    exit 1\n  fi\nfi\n";
		};
