name: PostRoll
options:
  bundleIdPrefix: com.dwphotony
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.3"

targets:
  PostRoll:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRoll
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "NO"
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: PostRoll
    postBuildScripts:
      # Record where this build was made from, so the app can find the Python
      # checkout at runtime (#648). The Python is NOT bundled: `postroll/` has
      # to be somewhere real on disk for anything to generate.
      #
      # This used to be a hardcoded `~/Documents/PostRoll` in AppPaths, and when
      # the project moved out of iCloud Drive on 2026-08-16 that folder stopped
      # existing. Recording it means moving the project and reinstalling fixes
      # itself, rather than rescheduling the same defect for the next move.
      #
      # Written by a script rather than by `INFOPLIST_KEY_POSTROLLProjectRoot`,
      # which was tried first and does NOT work: Xcode maps that prefix onto a
      # known set of Info.plist keys only, so the setting sat in this file and
      # the built app had no such key. Nothing about the setting looked wrong.
      # It was caught by reading the built bundle rather than the manifest.
      #
      # basedOnDependencyAnalysis: false so it runs on every build. The value
      # depends on where the checkout IS, which no input file records, so an
      # up-to-date check would keep a stale path across a move.
      #
      # Deliberately NOT run for PostRollTests: the tests inject this value, and
      # leaving it unrecorded there keeps "nothing was recorded" a state the
      # suite actually runs in rather than one nothing ever reaches.
      - name: Record the checkout this build was made from
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          # SRCROOT is the PostRollApp folder, so its parent is the checkout.
          # Resolved here rather than stored with a `..` still in it.
          ROOT="$(cd "${SRCROOT}/.." && pwd)"
          /usr/libexec/PlistBuddy -c "Delete :POSTROLLProjectRoot" "${PLIST}" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :POSTROLLProjectRoot string ${ROOT}" "${PLIST}"
          # Read it back. A write that silently did nothing is what this whole
          # change exists to stop, so the build fails rather than shipping an
          # app that cannot find its own code.
          WROTE="$(/usr/libexec/PlistBuddy -c "Print :POSTROLLProjectRoot" "${PLIST}")"
          if [ "${WROTE}" != "${ROOT}" ]; then
            echo "error: the checkout path was not recorded into ${PLIST}." >&2
            echo "error: wanted ${ROOT}, read back \"${WROTE}\"." >&2
            exit 1
          fi
          # This phase runs AFTER Xcode signs, and changing the Info.plist
          # breaks the seal, so the bundle has to be signed again. Measured, not
          # assumed: without this, `codesign --verify` on the build product
          # reports "plist or signature have been modified". An unsigned or
          # broken bundle has no stable identity for macOS to remember folder
          # permission grants against, which is what #83 fixed and what this
          # would quietly undo.
          #
          # Skipped when the build was told not to sign at all, which is how
          # build-install.sh builds: it signs the installed copy itself.
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ]; then
            IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            codesign --force --sign "${IDENTITY}" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
            codesign --verify --strict "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          fi
    entitlements:
      path: PostRoll.entitlements

  # Unit tests compile the model layer and EventStore directly into the
  # test bundle (no app hosting), so tests can never touch live data and
  # don't need to launch the GUI.
  PostRollTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # The whole of Sources, globbed, so a new file is compiled by the Swift
      # suite the moment it exists (#527). This was a hand-kept list of every
      # file, one path at a time: anything missing from it was exempt from the
      # entire Swift suite, and nothing failed when somebody forgot, because the
      # tests still passed, just without that file in them (L96). Six entries
      # were added by hand in one session, twice only after a build error made
      # it obvious.
      #
      # What is left OUT is written down here instead, where it reads as a
      # decision. tests/test_swift_test_target_covers_sources.py holds the
      # manifest to that: every Sources file is globbed in or named below.
      - path: Sources
        excludes:
          # The @main entry point. A test bundle is loaded into a host process
          # that already has one, so it must not carry a second.
          - PostRollApp.swift
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRollTests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: targeted
        # Set ONLY here, so test-only seams compiled behind it cannot be
        # reached from the shipping app. A seam guarded by a comment is a
        # convention; this makes it a build error.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: POSTROLL_TESTS

schemes:
  PostRoll:
    build:
      targets:
        PostRoll: all
        PostRollTests: [test]
    run:
      config: Debug
    test:
      targets:
        - PostRollTests

  # Unit tests only: builds the test bundle without the GUI, so
  # `xcodebuild -scheme PostRollTests test` runs the fast model/service suite
  # on its own.
  PostRollTests:
    build:
      targets:
        PostRollTests: [test]
    test:
      targets:
        - PostRollTests
