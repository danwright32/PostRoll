name: PostRoll
options:
  bundleIdPrefix: com.dwphotony
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.3"

targets:
  PostRoll:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRoll
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "NO"
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: PostRoll
    postBuildScripts:
      # Record where this build was made from, so the app can find the Python
      # checkout at runtime (#648). The Python is NOT bundled: `postroll/` has
      # to be somewhere real on disk for anything to generate.
      #
      # This used to be a hardcoded `~/Documents/PostRoll` in AppPaths, and when
      # the project moved out of iCloud Drive on 2026-08-16 that folder stopped
      # existing. Recording it means moving the project and reinstalling fixes
      # itself, rather than rescheduling the same defect for the next move.
      #
      # Written by a script rather than by `INFOPLIST_KEY_POSTROLLProjectRoot`,
      # which was tried first and does NOT work: Xcode maps that prefix onto a
      # known set of Info.plist keys only, so the setting sat in this file and
      # the built app had no such key. Nothing about the setting looked wrong.
      # It was caught by reading the built bundle rather than the manifest.
      #
      # basedOnDependencyAnalysis: false so it runs on every build. The value
      # depends on where the checkout IS, which no input file records, so an
      # up-to-date check would keep a stale path across a move.
      #
      # Deliberately NOT run for PostRollTests: the tests inject this value, and
      # leaving it unrecorded there keeps "nothing was recorded" a state the
      # suite actually runs in rather than one nothing ever reaches.
      - name: Record the checkout this build was made from
        basedOnDependencyAnalysis: false
        # The Info.plist is declared as an input so the build graph knows this
        # phase READS what `ProcessInfoPlistFile` writes, and therefore has to
        # run after it.
        #
        # Without the edge the two are unordered, and Xcode scheduled them both
        # ways on one machine in one afternoon: the plist was regenerated after
        # the stamp twice out of three builds, which erases the key and leaves a
        # Release app that cannot find the Python checkout. That is exactly the
        # #648 defect, back and intermittent.
        #
        # It was invisible because the phase VERIFIES ITS OWN WRITE and the
        # write really did land. Reading a value back proves only that it was
        # there at the moment you looked, never that anything later left it
        # alone (L12). What caught it was reading the finished build product,
        # which is what tests/test_project_root_recorded.py does.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -euo pipefail
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          # SRCROOT is the PostRollApp folder, so its parent is the checkout.
          # Resolved here rather than stored with a `..` still in it.
          ROOT="$(cd "${SRCROOT}/.." && pwd)"
          /usr/libexec/PlistBuddy -c "Delete :POSTROLLProjectRoot" "${PLIST}" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :POSTROLLProjectRoot string ${ROOT}" "${PLIST}"
          # Read it back. A write that silently did nothing is what this whole
          # change exists to stop, so the build fails rather than shipping an
          # app that cannot find its own code.
          WROTE="$(/usr/libexec/PlistBuddy -c "Print :POSTROLLProjectRoot" "${PLIST}")"
          if [ "${WROTE}" != "${ROOT}" ]; then
            echo "error: the checkout path was not recorded into ${PLIST}." >&2
            echo "error: wanted ${ROOT}, read back \"${WROTE}\"." >&2
            exit 1
          fi
          # The URL scheme an OmniFocus task note links to (#840). Downbeat
          # writes a postroll:// link into the note; macOS only knows which
          # bundle answers it from CFBundleURLTypes in the BUILT plist.
          #
          # Written here rather than as an `INFOPLIST_KEY_` setting for exactly
          # the reason the key above is: Xcode maps that prefix onto a known set
          # of Info.plist keys, and CFBundleURLTypes is not one of them, so the
          # setting would sit in this file looking correct and reach no build.
          #
          # In THIS phase rather than one of its own so there is a single point
          # that edits the finished plist, a single ordering edge against
          # `ProcessInfoPlistFile`, and a single re-seal below covering both
          # edits. A second phase would need its own copy of all three.
          # One spelling of the scheme in this script, which is also the one the
          # guard in tests/test_url_scheme_registered.py reads and holds Swift's
          # `DeepLink.scheme` to.
          POSTROLL_SCHEME="postroll"
          # The abstract name for the URL type, taken from the plist rather than
          # from `PRODUCT_BUNDLE_IDENTIFIER`. That variable is exported by
          # Xcode and by nothing else, so under `set -u` it takes the whole
          # phase down anywhere the phase is run outside a build, which is where
          # its own tests run it.
          URL_TYPE_NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "${PLIST}")"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "${PLIST}" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes array" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLName string ${URL_TYPE_NAME}" \
            -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string ${POSTROLL_SCHEME}" \
            "${PLIST}"
          # Read back, like the key above and for the same reason: a PlistBuddy
          # write that did nothing says nothing, and the symptom here would be a
          # green build whose link opens no application at all.
          WROTE_SCHEME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "${PLIST}")"
          if [ "${WROTE_SCHEME}" != "${POSTROLL_SCHEME}" ]; then
            echo "error: the ${POSTROLL_SCHEME}:// scheme was not registered in ${PLIST}." >&2
            echo "error: wanted ${POSTROLL_SCHEME}, read back \"${WROTE_SCHEME}\"." >&2
            exit 1
          fi
          # Changing the Info.plist can break the bundle's seal, so it is
          # signed again here and the signature verified. An unsigned or broken
          # bundle has no stable identity for macOS to remember folder
          # permission grants against, which is what #83 fixed and what this
          # would quietly undo.
          #
          # This used to say the phase runs AFTER Xcode signs. It does not, in
          # either configuration on Xcode 26: the ordering measured on this
          # toolchain is this phase, then `CodeSign`, so the plist edit breaks
          # no seal and Xcode seals the edited file itself. The re-sign is kept
          # anyway. It is correct under the ordering the old comment described,
          # harmless under the one that holds now, and its verification is what
          # caught #719. A signing step is not deleted on the strength of one
          # machine's phase order.
          #
          # Nested code is signed FIRST, and that is not tidiness: codesign
          # REFUSES to seal a bundle containing unsigned nested code, so
          # without this every Debug build of the app scheme died right here
          # with "code object is not signed at all" (#719). Release has no
          # nested code, which is why only Debug ever hit it and why nothing
          # this project routinely runs noticed.
          #
          # What to sign is discovered by reading the bundle, never listed by
          # name. Xcode does export EXECUTABLE_DEBUG_DYLIB_PATH and
          # EXECUTABLE_BLANK_INJECTION_DYLIB_PATH, and naming those two would
          # work today; a hand-kept list is exempt from the very check meant to
          # catch it the moment a build grows a third (L96). The issue that
          # reported this knew about PostRoll.debug.dylib and had never heard
          # of __preview.dylib.
          #
          # Skipped when the build was told not to sign at all, which is how
          # build-install.sh builds: it signs the installed copy itself.
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ]; then
            IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            BUNDLE="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
            MAIN="${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}"
            MACHO=0
            # Newline-only IFS so a build directory with a space in it survives.
            OLD_IFS="${IFS}"
            IFS="$(printf '\n_')" && IFS="${IFS%_}"
            for FOUND in $(/usr/bin/find "${BUNDLE}" -type f -print); do
              # `case` rather than `file ... | grep -q`, because under pipefail
              # a short-circuiting reader can fail the pipeline by killing its
              # producer, and that would read as "not Mach-O" and silently skip
              # a file that had to be signed (L183).
              case "$(/usr/bin/file -b "${FOUND}")" in
                Mach-O*) ;;
                *) continue ;;
              esac
              MACHO=$((MACHO + 1))
              [ "${FOUND}" = "${MAIN}" ] && continue
              if ! codesign --force --sign "${IDENTITY}" "${FOUND}"; then
                echo "error: could not sign nested code at ${FOUND}." >&2
                echo "error: this is the 'Record the checkout this build was made from' script phase, not Xcode's own signing step." >&2
                exit 1
              fi
            done
            IFS="${OLD_IFS}"
            # A sweep that matched NOTHING is not a bundle with nothing to
            # sign: every bundle has at least its main executable, so finding
            # none means the search itself is broken and its silence would
            # read as success (L100, L98).
            if [ "${MACHO}" -eq 0 ]; then
              echo "error: no Mach-O file was found anywhere in ${BUNDLE}, not even ${MAIN}." >&2
              echo "error: the nested-code sweep in the 'Record the checkout this build was made from' phase is matching nothing, so nothing was signed." >&2
              exit 1
            fi
            if ! codesign --force --sign "${IDENTITY}" "${BUNDLE}"; then
              echo "error: could not seal ${BUNDLE} after recording the checkout path." >&2
              echo "error: this is the 'Record the checkout this build was made from' script phase, not Xcode's own signing step." >&2
              exit 1
            fi
            if ! codesign --verify --strict "${BUNDLE}"; then
              echo "error: ${BUNDLE} does not verify after the 'Record the checkout this build was made from' phase re-signed it." >&2
              exit 1
            fi
          fi
    entitlements:
      path: PostRoll.entitlements

  # Unit tests compile the model layer and EventStore directly into the
  # test bundle (no app hosting), so tests can never touch live data and
  # don't need to launch the GUI.
  PostRollTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # The whole of Sources, globbed, so a new file is compiled by the Swift
      # suite the moment it exists (#527). This was a hand-kept list of every
      # file, one path at a time: anything missing from it was exempt from the
      # entire Swift suite, and nothing failed when somebody forgot, because the
      # tests still passed, just without that file in them (L96). Six entries
      # were added by hand in one session, twice only after a build error made
      # it obvious.
      #
      # What is left OUT is written down here instead, where it reads as a
      # decision. tests/test_swift_test_target_covers_sources.py holds the
      # manifest to that: every Sources file is globbed in or named below.
      - path: Sources
        excludes:
          # The @main entry point. A test bundle is loaded into a host process
          # that already has one, so it must not carry a second.
          #
          # Its reviewer is the PostRollUITests target below, which launches the
          # real application (#849). That is named here on purpose: a deliberate
          # exemption with no reviewer named in the same place has no reviewer at
          # all, and the gap stays invisible precisely because the exemption is
          # correct (L129). #842 hid in this file while every unit test passed.
          # tests/test_swift_test_target_covers_sources.py holds the pair
          # together, so removing the reviewer fails rather than quietly
          # restoring the blind spot.
          - PostRollApp.swift
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRollTests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: targeted
        # Set ONLY here, so test-only seams compiled behind it cannot be
        # reached from the shipping app. A seam guarded by a comment is a
        # convention; this makes it a build error.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: POSTROLL_TESTS

  # Something that can actually RUN the app entry point (#849).
  #
  # `PostRollApp.swift` is excluded from PostRollTests above, correctly: a unit
  # test bundle is loaded into a host that already has an entry point. The cost
  # of that correct decision was that nothing in the suite could run the file,
  # and its only cover was guards matching its TEXT. #842 hid there: a link left
  # an extra window behind and every unit test passed, because the defect was
  # which scene type the app declares and how many windows exist, and a text
  # match can see neither.
  #
  # A UI test launches the real application, so it can answer both. It is a
  # separate target with a separate scheme, deliberately: `make test` and the
  # PostRollTests scheme must not launch a GUI, and a target that is flaky by
  # nature must not be able to fail the fast suite.
  #
  # It does not run on pull requests either. See .github/workflows/ui.yml.
  PostRollUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: PostRoll
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRollUITests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        # Which application the runner launches and drives. Without it
        # `XCUIApplication()` has no target and every test reports about nothing.
        TEST_TARGET_NAME: PostRoll
        # Deliberately no test-only compilation flag here. The one the unit
        # bundle sets compiles the seams that let a test point AppState at a
        # temp store, and this target drives the real application through its
        # real surfaces instead: a UI test reaching a seam the shipping app
        # cannot reach would be testing a build nobody runs.
        #
        # Not named here on purpose. TestTargetHygieneTests counts every
        # occurrence of that flag's name in this file, comments included, and
        # requires exactly one, so writing it in a comment fails the guard that
        # keeps the seams out of the shipping app.

schemes:
  PostRoll:
    build:
      targets:
        PostRoll: all
        PostRollTests: [test]
    run:
      config: Debug
    test:
      targets:
        - PostRollTests

  # Unit tests only: builds the test bundle without the GUI, so
  # `xcodebuild -scheme PostRollTests test` runs the fast model/service suite
  # on its own.
  PostRollTests:
    build:
      targets:
        PostRollTests: [test]
    test:
      targets:
        - PostRollTests

  # The GUI suite, on its own, so nothing that runs the fast suite can launch a
  # window (#849). Builds the app because that is what it drives.
  PostRollUITests:
    build:
      targets:
        PostRoll: all
        PostRollUITests: [test]
    run:
      config: Debug
    test:
      targets:
        - PostRollUITests
