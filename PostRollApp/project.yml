name: PostRoll
options:
  bundleIdPrefix: com.dwphotony
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.3"

targets:
  PostRoll:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRoll
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "NO"
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: PostRoll
    entitlements:
      path: PostRoll.entitlements

  # Unit tests compile the model layer and EventStore directly into the
  # test bundle (no app hosting), so tests can never touch live data and
  # don't need to launch the GUI.
  PostRollTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Models
      - path: Sources/Services/EventStore.swift
      - path: Sources/Services/ArchiveCleanup.swift
      - path: Sources/Services/AppPaths.swift
      - path: Sources/Services/OrphanedMediaCleanup.swift
      - path: Sources/Services/DeletionPolicy.swift
      - path: Sources/Services/MediaReclaim.swift
      - path: Sources/Services/DayStateMerger.swift
      - path: Sources/Services/EventJobTracker.swift
      - path: Sources/Services/EventExporter.swift
      - path: Sources/Services/PostingPresetStore.swift
      - path: Sources/Services/CollageCandidate.swift
      - path: Sources/Services/CollageCandidateCache.swift
      - path: Sources/Services/PreviewMergePolicy.swift
      - path: Sources/Services/PreviewRunState.swift
      - path: Sources/Services/PerformerPanelDisplay.swift
      - path: Sources/Services/PhotoTagBatch.swift
      - path: Sources/Services/PhotoThumbControls.swift
      - path: Sources/Services/PhotoTagSheetNavigation.swift
      - path: Sources/Services/EventHandleSuggestions.swift
      - path: Sources/Services/FridayReviewDisplay.swift
      - path: Sources/Services/CoverReviewDisplay.swift
      - path: Sources/Services/BlogFindingsDisplay.swift
      - path: Sources/Services/DebouncedStoreWriter.swift
      - path: Sources/Services/EventStageTransition.swift
      - path: Sources/Services/StoreBackups.swift
      - path: Sources/Services/InsightsDisplay.swift
      - path: Sources/Services/AnalyticsStore.swift
      - path: Sources/Services/PipelineProgress.swift
      - path: Sources/Services/ProgramPDFBuilder.swift
      - path: Sources/Services/ProgramScanRetention.swift
      - path: Sources/Services/DataMigration.swift
      - path: Sources/Services/CollageRenderer.swift
      - path: Sources/Services/CollageGeometry.swift
      - path: Sources/Services/ClipCropFrameStrip.swift
      - path: Sources/Services/LegacyDataReclaim.swift
      - path: Sources/Services/MediaPresence.swift
      - path: Sources/Services/MissingMediaScan.swift
      - path: Sources/Services/StoredErrorPolicy.swift
      - path: Sources/Services/PythonBridgeError.swift
      - path: Sources/Services/ProcessRunner.swift
      - path: Sources/Services/PythonBridge.swift
      - path: Sources/Services/TimingStore.swift
      - path: Sources/Services/KeychainStore.swift
      - path: Sources/Views/SpellCheckingTextEditor.swift
      - path: Sources/DesignTokens.swift
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRollTests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: targeted

  # UI smoke tests drive the real app against a sandboxed data directory
  # (POSTROLL_DATA_DIR), so they can never touch live data.
  PostRollUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: PostRoll
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRollUITests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: PostRoll

schemes:
  PostRoll:
    build:
      targets:
        PostRoll: all
        PostRollTests: [test]
        PostRollUITests: [test]
    run:
      config: Debug
    test:
      targets:
        - PostRollTests
        - PostRollUITests

  # Unit tests only: builds the test bundle without the GUI or UI tests, so
  # `xcodebuild -scheme PostRollTests test` runs the fast model/service suite
  # on its own.
  PostRollTests:
    build:
      targets:
        PostRollTests: [test]
    test:
      targets:
        - PostRollTests
