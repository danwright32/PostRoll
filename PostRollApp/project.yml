name: PostRoll
options:
  bundleIdPrefix: com.dwphotony
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.3"

targets:
  PostRoll:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRoll
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "NO"
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: PostRoll
    entitlements:
      path: PostRoll.entitlements

  # Unit tests compile the model layer and EventStore directly into the
  # test bundle (no app hosting), so tests can never touch live data and
  # don't need to launch the GUI.
  PostRollTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Models
      - path: Sources/Services/EventStore.swift
      - path: Sources/Services/ArchiveCleanup.swift
      - path: Sources/Services/AppPaths.swift
      - path: Sources/Services/OrphanedMediaCleanup.swift
      - path: Sources/Services/DeletionPolicy.swift
      - path: Sources/Services/MediaReclaim.swift
      - path: Sources/Services/DayStateMerger.swift
      - path: Sources/Services/EventJobTracker.swift
      - path: Sources/Services/EventExporter.swift
      - path: Sources/Services/PostingPresetStore.swift
      - path: Sources/Services/CollageCandidate.swift
      - path: Sources/Services/CollageCandidateCache.swift
      - path: Sources/Services/AudioPreviewPlayer.swift
      - path: Sources/Services/ProgressFileCleanup.swift
      - path: Sources/Services/ExportFolderStatus.swift
      - path: Sources/Services/SettingsCopy.swift
      - path: Sources/Views/ReelPreviewPlayer.swift
      - path: Sources/Views/BrandBanner.swift
      - path: Sources/Views/ExportDoneSummary.swift
      - path: Sources/Views/SharedChrome.swift
      - path: Sources/Views/HaltedWeekBody.swift
      - path: Sources/Views/GenerationScreenBodies.swift
      - path: Sources/Services/GenerationFailureText.swift
      - path: Sources/Services/GenerationRunPlan.swift
      - path: Sources/Views/CaptionReviewBodies.swift
      - path: Sources/Views/OCRReviewBodies.swift
      - path: Sources/Services/OCRReviewReadiness.swift
      - path: Sources/Views/PhotoAssignmentBodies.swift
      - path: Sources/Services/Sentence.swift
      - path: Sources/Services/SaveFailureNotice.swift
      - path: Sources/Services/RunFailureKind.swift
      - path: Sources/Services/NewEventValidation.swift
      - path: Sources/Services/ManifestDay.swift
      - path: Sources/Services/StageNavigation.swift
      - path: Sources/Services/LayoutSidecar.swift
      - path: Sources/Services/DesignStamp.swift
      - path: Sources/Services/DesignStaleScan.swift
      - path: Sources/Services/OutdatedDesignsDisplay.swift
      - path: Sources/Services/BuildFreshness.swift
      - path: Sources/Services/PreviewMergePolicy.swift
      - path: Sources/Services/PreviewRunState.swift
      - path: Sources/Services/PerformerPanelDisplay.swift
      - path: Sources/Services/PhotoTagBatch.swift
      - path: Sources/Services/PhotoThumbControls.swift
      - path: Sources/Services/PhotoTagSheetNavigation.swift
      - path: Sources/Services/PhotoTagSuggestionList.swift
      - path: Sources/Services/EventHandleSuggestions.swift
      - path: Sources/Services/FridayReviewDisplay.swift
      - path: Sources/Services/CoverReviewDisplay.swift
      - path: Sources/Services/BlogDraftText.swift
      - path: Sources/Services/FindingsDisplay.swift
      - path: Sources/Services/DebouncedStoreWriter.swift
      - path: Sources/Services/EventStageTransition.swift
      - path: Sources/Services/StoreBackups.swift
      - path: Sources/Services/StoreSaveGate.swift
      - path: Sources/Views/ImageLoad.swift
      - path: Sources/Views/LongRunIndicator.swift
      - path: Sources/Services/BrandVoiceSaveText.swift
      - path: Sources/Services/FieldText.swift
      - path: Sources/Services/StoreRestoreText.swift
      - path: Sources/Services/DataInventory.swift
      - path: Sources/Services/ExportStaging.swift
      - path: Sources/Services/CollageBakeOutcome.swift
      - path: Sources/Services/InsightsDisplay.swift
      - path: Sources/Services/CaptionBlocks.swift
      - path: Sources/Services/BlogMeta.swift
      - path: Sources/Services/AccountBook.swift
      - path: Sources/Services/RecurringAccounts.swift
      - path: Sources/Services/EventHandleSuggestions.swift
      - path: Sources/Services/CollaboratorPick.swift
      - path: Sources/Services/ScrollEdgeFade.swift
      - path: Sources/Services/ExportReadiness.swift
      - path: Sources/Services/ExportManifest.swift
      - path: Sources/Services/ReelAudioSwap.swift
      - path: Sources/Services/CollageLayoutReset.swift
      - path: Sources/Services/AnalyticsStore.swift
      - path: Sources/Services/PipelineProgress.swift
      - path: Sources/Services/LongRunStatus.swift
      - path: Sources/Services/ProgramPDFBuilder.swift
      - path: Sources/Services/ProgramImport.swift
      - path: Sources/Services/ProgramReadiness.swift
      - path: Sources/Services/ProgramShortfall.swift
      - path: Sources/Services/VisionTextLayer.swift
      - path: Sources/Services/HaltedWeek.swift
      - path: Sources/Services/PartialWeekMerge.swift
      - path: Sources/Services/MediaErrorSummary.swift
      - path: Sources/Services/RunOutcomeNotice.swift
      - path: Sources/Services/ProgramScanRetention.swift
      - path: Sources/Services/DataMigration.swift
      - path: Sources/Services/CollageRenderer.swift
      - path: Sources/Services/CollageGeometry.swift
      - path: Sources/Services/ClipCropFrameStrip.swift
      - path: Sources/Services/LegacyDataReclaim.swift
      - path: Sources/Services/MediaPresence.swift
      - path: Sources/Services/MissingMediaScan.swift
      - path: Sources/Services/StoredErrorPolicy.swift
      - path: Sources/Services/PythonBridgeError.swift
      - path: Sources/Services/ProcessRunner.swift
      - path: Sources/Services/PythonBridge.swift
      - path: Sources/Services/CaptionCreditInputs.swift
      - path: Sources/Services/TimingStore.swift
      - path: Sources/Services/KeychainStore.swift
      - path: Sources/Services/ExportManager.swift
      - path: Sources/Services/NotificationService.swift
      - path: Sources/AppState.swift
      - path: Sources/Views/SpellCheckingTextEditor.swift
      - path: Sources/DesignTokens.swift
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRollTests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: targeted
        # Set ONLY here, so test-only seams compiled behind it cannot be
        # reached from the shipping app. A seam guarded by a comment is a
        # convention; this makes it a build error.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: POSTROLL_TESTS

  # UI smoke tests drive the real app against a sandboxed data directory
  # (POSTROLL_DATA_DIR), so they can never touch live data.
  PostRollUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: PostRoll
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRollUITests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: PostRoll

schemes:
  PostRoll:
    build:
      targets:
        PostRoll: all
        PostRollTests: [test]
        PostRollUITests: [test]
    run:
      config: Debug
    test:
      targets:
        - PostRollTests
        - PostRollUITests

  # Unit tests only: builds the test bundle without the GUI or UI tests, so
  # `xcodebuild -scheme PostRollTests test` runs the fast model/service suite
  # on its own.
  PostRollTests:
    build:
      targets:
        PostRollTests: [test]
    test:
      targets:
        - PostRollTests
