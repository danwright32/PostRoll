name: PostRoll
options:
  bundleIdPrefix: com.dwphotony
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.3"

targets:
  PostRoll:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRoll
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "NO"
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: PostRoll
    entitlements:
      path: PostRoll.entitlements

  # Unit tests compile the model layer and EventStore directly into the
  # test bundle (no app hosting), so tests can never touch live data and
  # don't need to launch the GUI.
  PostRollTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Models
      - path: Sources/Services/EventStore.swift
      - path: Sources/Services/ArchiveCleanup.swift
      - path: Sources/Services/AppPaths.swift
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwphotony.PostRollTests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: targeted

schemes:
  PostRoll:
    build:
      targets:
        PostRoll: all
        PostRollTests: [test]
    run:
      config: Debug
    test:
      targets:
        - PostRollTests
