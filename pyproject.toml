# Tooling configuration for the Python side of PostRoll.
#
# This is configuration only. The package itself is not installed; the app runs
# it in place with `python -m postroll.ai.<module>` from the repo root.

[tool.pytest.ini_options]
# Where the suites live, so `pytest` with no arguments runs the right thing and
# cannot wander into venv/ or the Swift tree (#114).
testpaths = ["tests"]

# The repo root on sys.path, replacing the `PYTHONPATH=.` prefix that every
# invocation had to remember. A test run that works locally and fails in CI
# because one of them forgot the prefix is a difference with no meaning.
pythonpath = ["."]

# -ra reports every skip, so a suite that quietly stops running is visible
# rather than reading as a pass. --strict-markers turns a typo in a marker name
# into an error instead of a silently unfiltered test.
#
# --dist worksteal is the third, and it is about wall clock rather than honesty
# (#783). Plain `-n auto` is a shortcut for `--dist load`, which does NOT deal
# tests out one at a time: it gives each worker an initial CONTIGUOUS chunk of
# the collection, `len(collection) // numprocesses // 4` items, and only refills
# singly after that. A test file's tests are contiguous, so a whole expensive
# file fits inside one chunk and lands on one worker.
#
# Measured on this Mac on 2026-08-21, 3327 tests over 12 workers, 770s of summed
# CPU. Under `--dist load` one worker carried 220.9s, two carried about 150s, and
# the remaining nine carried 22 to 37s each. The run took 224s, which is that one
# worker's share: everything else had finished and was idle.
#
# `worksteal` starts the same way and then lets an idle worker take pending work
# off a busy one. Same suite, same machine, same day: 121s. It costs a little CPU
# (886s to 929s of user time) for nearly half the wall clock.
#
# `--timeout` is the fourth, and it is about being TOLD what wedged (#836).
# #832 gave every CI job a deadline, which stops a wedged run burning the
# platform default, but a job killed that way reports only that the job ran out
# of time. Finding out which test it was took cancelling two runs and pairing
# each `pytest -v` start line against its verdict by hand. A per-test deadline
# makes that one red line naming the test, with the stack it was stuck in.
#
# 600s, sized from a reading rather than picked round. The slowest single test
# measured anywhere is 94.84s, on the macOS runner, and it is the same test
# every time: three runs on 2026-08-22 put it at 94.84s, 76.65s and 75.34s, and
# this Mac at 91.23s. The Linux leg's slowest is a different test at 31.3s. So
# this is 6.3x the worst reading, and there is nothing in the distribution
# between 95s and it: the next slowest test is 68s (L172).
#
# Sized generously on purpose. A wedge is unbounded, so any finite limit catches
# it, and the only thing a tighter number buys is a red suite on a slow morning.
# It still sits well inside the shortest job that runs pytest, which is 20
# minutes, so the job deadline stays the backstop for a run that wedges OUTSIDE
# a test where no per-test limit can see it.
#
# `--timeout-method=signal` is the default wherever SIGALRM exists, which is
# both our platforms, and is pinned because the alternative is not equivalent:
# `thread` terminates the whole worker, and pytest-timeout documents junit XML
# as not functioning normally under it. `tools/record_test_durations.py` reads
# that report to decide whether a red run may still be recorded (#837), so a
# silent switch would leave it refusing every run it was changed to allow.
#
# Set here rather than on each command, so the local targets, the CI legs and the
# reference-frame shards cannot disagree about it (L41). Harmless with no `-n`:
# a run with one process ignores it.
addopts = "-ra --strict-markers --dist worksteal --timeout=600 --timeout-method=signal"

# Declared so --strict-markers accepts it. `slow` means EXPENSIVE, and nothing
# else since #766: which files carry it is derived from a measurement in
# tests/fixtures/test_file_durations.json rather than from which files need the
# macOS system faces, which is a different property that has its own guard.
# `make test-python-fast` deselects them for the loop between edits; CI still
# runs everything (#413).
markers = [
    "slow: measured above the floor in tests/file_durations.py, so the fast run may skip it",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow (#113). A lint that lands with hundreds of pre-existing
# violations gets switched off or ignored, so this starts with the rules that
# catch real defects rather than style opinions:
#   E9  syntax errors and the like
#   F   pyflakes: undefined names, unused imports, f-strings with no placeholder
#   B   bugbear: mutable default arguments, except-without-raise, and friends
# Style rules can be added later, one at a time, each with its own cleanup.
select = ["E9", "F", "B"]

# B905 is zip() without an explicit strict=. It is a real safety property, and
# turning it on would raise where two sequences silently differ in length, but
# it changes runtime behaviour at 15 call sites and each needs its own decision
# about what a mismatch there should do. Left off deliberately rather than
# switched on blind; #113 records that the rest of the set is enforced.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Tests reach for star-imports, unused fixtures, loop variables they only
# partly unpack, and objects built in default arguments. None of those mean
# anything in a test the way they do in the pipeline.
"tests/*" = ["F401", "F811", "B007", "B008"]
