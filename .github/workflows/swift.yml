name: macOS

# Split out of tests.yml so it can carry its own trigger rules (#233).
#
# The swift job used to live there behind `if: github.event_name !=
# 'pull_request'`, a deliberate cost decision: this repo is private, where
# macOS runner minutes bill at a 10x multiplier.
#
# The cost of that decision showed up on 2026-08-09. A compile error in test
# setup, which only the older Xcode in CI rejects, sat red on main across eight
# merges. Both signals available at merge time were structurally unable to show
# it: PRs skipped this job entirely, and running the suite locally passes
# because the local Xcode is the one that ACCEPTS the code CI rejects.
#
# So the trade is narrowed rather than reversed. A pull request runs this only
# when it touches something that can break the Swift build, and a PR that
# cannot still costs nothing. Pushes to main run it regardless of what changed,
# so main is always fully verified.
#
# Touching the app is not the only way (#246). Swift tests also read shared
# cross-language fixtures under `tests/fixtures/`, so a PR that regenerates one
# from the Python side can turn the Swift suite red. The whole directory is
# listed rather than the two files those tests read today: more shared fixtures
# are coming (#168, #124), and the failure mode of naming files one at a time
# is that the next one is added by someone not thinking about this file. Some
# fixtures there are Python-only, so this occasionally runs the job for nothing,
# which is the cheap side of the trade against missing a break entirely.
#
# It also carries the reference-frame checks (#163), which is why this is the
# macOS job rather than the Swift job. Those render the real templates, and the
# templates draw with macOS system fonts (SignPainter, HelveticaNeue) that the
# Linux runner in tests.yml does not have, so a recorded frame can only be
# compared on a Mac. Reusing the runner that is already being paid for beats
# starting a second one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "PostRollApp/**"
      - "tests/fixtures/**"
      - "postroll/media/**"
      # Every font-dependent check by name. `tests/test_ci_runs_the_font_dependent_checks.py`
      # asserts this list against the files actually carrying the marker, in
      # both directions, so a new one cannot be added without landing here.
      - "tests/test_golden_frames.py"
      - "tests/test_frame_legibility.py"
      - "tests/test_gallery_alignment.py"
      - "tests/test_slider_program_plate.py"
      # The wordmark the reference frames and the legibility bands both draw
      # with. The colophon check takes the mark's INK from this file, so
      # swapping it changes what every one of those checks measures (#246, L88).
      - "postroll/assets/**"
      - ".github/workflows/swift.yml"
  workflow_dispatch:

# Pushing a fix to a pull request used to leave the superseded run billing to
# completion, nine macOS minutes at the 10x private-repo multiplier, for a commit
# nobody would ever merge (#430).
#
# The group is the PR number rather than the ref, so a push to main gets a group
# of its own keyed by SHA. That matters in both directions: a merge is never
# cancelled by the next one (cancel-in-progress is false for pushes anyway), and
# it is never QUEUED behind the previous one either, which a ref-keyed group
# would have done to every pair of back-to-back merges.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs the PostRollTests scheme, not the PostRoll scheme, so the GUI-driving
  # PostRollUITests target is excluded: a headless runner cannot reliably drive
  # XCUIApplication. Then the reference-frame checks, which need this runner's
  # fonts.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is generated from project.yml, so CI regenerates it
      # rather than trusting a checked-in copy that may be behind the manifest.
      - name: Generate the Xcode project
        working-directory: PostRollApp
        run: xcodegen generate

      # The key has to carry the TOOLCHAIN, not just the sources (#412). CI runs
      # an older Xcode than the dev machine, and modules built by one are not
      # valid input for another, so a key without it restores a cache that is
      # worse than no cache: a build that fails for a reason unrelated to the
      # change. Computed into an output once, so the restore and the save cannot
      # end up spelling the same key two different ways.
      - name: Work out the build-cache key
        id: cache-key
        run: |
          toolchain=$(xcodebuild -version | tr -d ' .' | tr '\n' '-')
          prefix="derived-data-${{ runner.os }}-${toolchain}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}-${{ hashFiles('PostRollApp/**/*.swift', 'PostRollApp/project.yml') }}" >> "$GITHUB_OUTPUT"

      # restore + save rather than actions/cache, because the save has to be a
      # step this file controls: the folder is pruned and measured before
      # anything is uploaded.
      - name: Restore the build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: PostRollApp/.derived-data
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}-

      - name: Run the Swift unit tests
        run: |
          xcodebuild \
            -project PostRollApp/PostRoll.xcodeproj \
            -scheme PostRollTests \
            -destination 'platform=macOS' \
            -derivedDataPath PostRollApp/.derived-data \
            test

      # Only the compiled products earn their upload. Index.noindex is the
      # editor's symbol index, which nothing on a runner reads, and Logs is a
      # transcript of the run that just finished.
      #
      # The cap is the point of measuring: overture#2585 is this same folder
      # filling a 926 GiB volume, and GitHub evicts a repo's oldest entries once
      # it holds 10 GB, so an unbounded upload here would quietly push out the
      # pip and ffmpeg caches and slow down the runs this was added to speed up.
      # Over the cap it declines to save and says so, which leaves the job as
      # slow as it is today rather than breaking it.
      - name: Prune and measure the build cache
        if: ${{ !cancelled() && steps.build-cache.outputs.cache-hit != 'true' }}
        id: cache-size
        run: |
          rm -rf PostRollApp/.derived-data/Index.noindex PostRollApp/.derived-data/Logs
          megabytes=$(du -sm PostRollApp/.derived-data | cut -f1)
          echo "Build cache is ${megabytes} MB after pruning (cap 2000 MB)."
          if [ "${megabytes}" -gt 2000 ]; then
            echo "over-cap=true" >> "$GITHUB_OUTPUT"
            echo "Not uploading it: over the cap."
          else
            echo "over-cap=false" >> "$GITHUB_OUTPUT"
          fi

      # Saved even when the tests went red, because the run most likely to want
      # a warm cache is the re-push that fixes them. Not on a cancelled run: a
      # half-written folder is not worth keeping under a key that then looks
      # like a hit.
      - name: Save the build cache
        if: ${{ !cancelled() && steps.build-cache.outputs.cache-hit != 'true' && steps.cache-size.outputs.over-cap == 'false' }}
        uses: actions/cache/save@v4
        with:
          path: PostRollApp/.derived-data
          key: ${{ steps.cache-key.outputs.key }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The reel references are pulled out of an encoded file, so this is not
      # optional here the way it is for most of the Python suite.
      - name: Install ffmpeg
        run: brew install ffmpeg

      # Both variables turn a skip into a hard failure. A reference-frame check
      # that quietly skips for want of ffmpeg or a system font is
      # indistinguishable from one that passed, which is the whole failure mode
      # this job exists to close. -ra reports any skip that does remain.
      #
      # test_frame_legibility.py was missing here until 2026-08-11. It carries
      # the checks that read text back out of an encoded reel (#298) and the
      # scrolling colophon check (#306), every one of them font-gated, so they
      # skipped on Linux and were never invoked on the Mac. Both were proven on
      # Dan's machine and neither was wired (L3): they had never run in CI.
      #
      # test_gallery_alignment.py was missed by the FIRST version of that fix,
      # because it defines its own font-gate marker under a different name and
      # the guard was matching one remembered spelling. Four more checks were
      # running nowhere, including the only pixel-level test of the slider's
      # labels. The guard now matches the shape of the name instead:
      # tests/test_ci_runs_the_font_dependent_checks.py.
      - name: Run the reference-frame and legibility checks
        env:
          POSTROLL_REQUIRE_FFMPEG: "1"
          POSTROLL_REQUIRE_GOLDENS: "1"
      #
      # `-n auto` because these four files are 586s of this job's 13 minutes,
      # every second of it spent rendering real reels through ffmpeg. Locally,
      # four workers took them from 495s to 221s. Safe to parallelise because
      # every test here writes only into pytest's per-test tmp_path and reads
      # everything else; `test_reference_frames_are_safe_to_parallelise` holds
      # that true. `auto` rather than a fixed count so it follows the runner
      # rather than this Mac.
        run: >
          pytest tests/test_golden_frames.py tests/test_frame_legibility.py
          tests/test_gallery_alignment.py tests/test_slider_program_plate.py
          -n auto -v -ra
