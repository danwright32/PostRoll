name: macOS

# Split out of tests.yml so it can carry its own trigger rules (#233), and split
# again into two parallel jobs (#431).
#
# ── why every pull request runs this ─────────────────────────────────────────
#
# It did not always. The Swift job used to be skipped on pull requests
# altogether, and then ran only when a PR touched a hand-listed set of paths.
# Both versions were cost decisions: macOS runner minutes bill at a 10x
# multiplier on a PRIVATE repo. This repo is public while its backlog is being
# worked through, so that multiplier is dormant rather than gone, and it applies
# again the day the repo goes private.
#
# The cost of the first version showed up on 2026-08-09. A compile error in test
# setup, which only the older Xcode in CI rejects, sat red on main across eight
# merges. Both signals available at merge time were structurally unable to show
# it: PRs skipped this job entirely, and running the suite locally passes because
# the local Xcode is the one that ACCEPTS the code CI rejects.
#
# The paths filter that replaced it narrowed the hole rather than closing it, and
# maintaining it was its own failure mode: #246 was a job filtered to the app
# folder while two of its tests read cross-language fixtures living beside the
# Python suite, and a skipped job looks exactly like a passing one.
#
# So on 2026-08-13 Dan decided to remove the filter for good rather than keep
# tuning it: every pull request runs both jobs, whatever it touched, and the
# minutes are accepted as the price of never having to ask whether the check that
# stayed silent was the one that mattered. Re-narrowing this is a deliberate
# decision to reopen that hole, not a tidy-up.
#
# ── why two jobs ─────────────────────────────────────────────────────────────
#
# The two halves are independent and were running in sequence inside one job, so
# a Swift compile error was reported only after seven minutes of rendering reels.
# They are separate jobs now: the Swift half reports in about 90 seconds, both
# still block a merge, and the wall clock is the slower of the two rather than
# their sum.
#
# The reference-frame checks (#163) belong on a Mac rather than in tests.yml
# because they render the real templates, and the templates draw with macOS
# system fonts (SignPainter, HelveticaNeue) that the Linux runner does not have,
# so a recorded frame can only be compared here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pushing a fix to a pull request used to leave the superseded run running to
# completion, nine macOS minutes, for a commit nobody would ever merge (#430).
#
# The group is the PR number rather than the ref, so a push to main gets a group
# of its own keyed by SHA. That matters in both directions: a merge is never
# cancelled by the next one (cancel-in-progress is false for pushes anyway), and
# it is never QUEUED behind the previous one either, which a ref-keyed group
# would have done to every pair of back-to-back merges.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the PostRoll app, then runs the PostRollTests scheme. The app is
  # BUILT and not TESTED on purpose: building is what catches a view file that
  # does not compile, which nothing in CI did until #521.
  #
  # This used to say a headless runner cannot reliably drive a window, which is
  # why #509 deleted the UI smoke test rather than moving it here. That was
  # measured on macos-26 on 2026-08-23 and is false: `launchctl managername`
  # answers Aqua, the app launches, and the GUI suite passes in about nine
  # seconds. It runs from .github/workflows/ui.yml (#849).
  #
  # The GUI suite still does not belong in THIS job, for the two reasons that
  # were always the stronger ones. It is slow and flaky by nature and must not
  # fail the suite every pull request waits on, and a new required check name
  # cannot be made green without a knowingly red merge, since
  # tools/wait_for_checks.py derives its bar from the workflows that trigger on
  # pull requests and the fixture it is calibrated against can only be recorded
  # from a green run already carrying the name.
  #
  # ── why this half runs on macos-26 and the other on macos-15 ────────────────
  #
  # It ran on macos-15, whose newest Xcode is 16.4, while the Mac this is
  # written on runs 26.6. The older compiler rejects code the newer one accepts,
  # so six CI round trips in one session were compile errors that build clean
  # locally, including with SWIFT_STRICT_CONCURRENCY forced. Every one was only
  # visible after a push (#528).
  #
  # macos-26 carries Xcode 26.6, build 17F113, which is the build on that Mac.
  # The rule is one-directional and tools/check_toolchain.py enforces the other
  # end of it: CI's compiler at or ahead of the local one is fine, because it
  # accepts everything the local one does; CI BEHIND is the hole.
  #
  # reference-frames deliberately stays on macos-15. It needs the runner for its
  # system FONTS, and the recorded frames were compared against that image's
  # copies of them; moving it is a change to what the goldens are measured
  # against, not a version bump.
  swift-unit:
    runs-on: macos-26
    # Same reason as the python job (#832). 45 rather than a tighter number
    # because this compiles the app and runs 2250 tests, measured at 8m44s, and
    # it matches what the macOS job in tests.yml already carries for work of the
    # same kind.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Has a green pull request already checked this exact tree? (#990)
      #
      # Every commit on main is a squash merge made by
      # tools/wait_for_checks.py --merge, which refuses a head that does not
      # contain main (exit 6, #680) and merges the exact commit it judged. A
      # squash of a head containing its base produces the head's tree byte for
      # byte, so the steps below would re-run swift-unit against content it has
      # already passed on. Measured over the 25 most recent merges, each had
      # exactly one associated pull request and the trees matched 25 times out
      # of 25; measured over the last 24 pushes to main, the jobs this gate can
      # skip are 23 macOS runner-minutes per merge.
      #
      # A step rather than a job on purpose. A new job is a new CHECK NAME, and
      # tools/wait_for_checks.py derives the bar a pull request has to clear
      # from these workflow files, calibrated against a recorded reply from a
      # real green pull request. Adding a name means a run carrying it can only
      # go green once the fixture already holds it, so there is no green run to
      # record from and breaking the loop costs a knowingly red merge (L48).
      #
      # `push` only. On a pull request this must never fire: an up-to-date
      # branch can carry the same tree as its own head, so a re-run would find
      # the previous run's green and skip the very check the merge is judged by.
      #
      # Every step below asks `!= 'false'` rather than `== 'true'`, so the gate
      # not running at all, or answering nothing, runs the work. Only the one
      # positive answer skips (L98).
      - name: Say whether a green pull request already checked this tree
        id: already
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_tree_already_checked.py --check "swift-unit"


      # Not the image default. A runner image updates its default Xcode without
      # a commit here, which is how the compiler moved out from under the repo
      # in the first place, so the version is read out of the file that
      # tools/check_toolchain.py holds this Mac to (L25, L41). Absent is a hard
      # failure naming what the image does have: falling back to the default
      # would be the silent drift this step exists to stop.
      - name: Select the recorded Xcode
        if: steps.already.outputs.run != 'false'
        run: |
          version="$(cat PostRollApp/.ci-xcode-version)"
          app="/Applications/Xcode_${version}.app"
          if [ ! -d "${app}" ]; then
            echo "PostRollApp/.ci-xcode-version asks for Xcode ${version}, which is not"
            echo "on this runner image. What it has:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "${app}"
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.already.outputs.run != 'false'
        run: brew install xcodegen

      # The .xcodeproj is generated from project.yml, so CI regenerates it
      # rather than trusting a checked-in copy that may be behind the manifest.
      - name: Generate the Xcode project
        if: steps.already.outputs.run != 'false'
        working-directory: PostRollApp
        run: xcodegen generate
      # There is deliberately NO DerivedData build cache here any more (#991).
      #
      # It restored on every run and prevented no compilation at all. Measured
      # on 2026-08-30 across the eight most recent runs: every one restored a
      # cache and every one compiled 529 or 530 units. Three of them settle it
      # beyond a prefix-restore explanation. Commits a45b77e4, 36ac281b and
      # 4a3af765 changed ZERO files under PostRollApp/**/*.swift and no
      # project.yml, so all three computed the same primary key the 21ea9a18 run
      # had just saved; all three restored exactly that entry; all three skipped
      # saving, which is what actions/cache does on a primary-key hit; and all
      # three compiled 530 units.
      #
      # The cause #991 proposed, that `xcodegen generate` rewrites the project
      # and the build system keys on that, is wrong, and was measured to be:
      # locally a warm build took 72s, then `xcodegen generate` ran, then the
      # same build took 2s and compiled 0 units. Regenerating invalidates
      # nothing. What does is the environment: a fresh checkout stamps every
      # source with a new mtime, newer than the restored object files, and
      # Xcode's incremental build is mtime based, so everything reads as stale
      # however exact the cache hit is.
      #
      # It was not free: 5 to 13s of restore on every run, and the entries held
      # 19 GB against GitHub's 10 GB repository limit, evicting the pip and
      # ffmpeg caches that do work.
      #
      # Re-adding one needs an answer to that measurement rather than an
      # intuition that a cache must help. tests/test_no_dead_build_cache.py
      # names what would have to be shown.

      # Through tools/suite_counts.py rather than calling xcodebuild directly
      # (#1017). `make test-swift` has read an executed-tests count since #932,
      # but this step did not, so the one place nobody watches the scroll was
      # the only place with no number at all. xcodebuild reports TEST SUCCEEDED
      # for a run that lost a worker's share exactly as it does for a full one,
      # so the count is the only thing that tells them apart (L98).
      #
      # The tool streams the transcript straight through and returns
      # xcodebuild's own exit code, so a red suite stays red for its own reason
      # and the floor is a SECOND verdict rather than a replacement for the
      # first (L53).
      #
      # `python3` is the runner's own: every module this reaches is stdlib, and
      # this job has no venv because it has never needed one.
      #
      # This runs the whole scheme, where `make test-swift` skips the three
      # REVIEW_TESTS dump methods. That is a difference of 3 tests against a
      # tolerance of 51, so one recorded count serves both. The guard in
      # tests/test_swift_leg_meets_its_floor.py holds that gap inside the
      # tolerance, so growing REVIEW_TESTS reports the problem rather than
      # quietly pushing local runs under the floor.
      #
      # Parallel since #992, which is worth most of this step. Measured on
      # 2026-08-30 against Xcode 26.6, the version the pin selects: the suite is
      # 294s of test bodies serially and 106s wall in parallel, and the packing
      # is near perfect up to four workers before it hits its floor, which is the
      # heaviest single class at 68s.
      #
      # The flag is here rather than in the SCHEME, deliberately. The flag alone
      # parallelises with the scheme still saying parallelizable="NO", and
      # keeping it out of the scheme leaves `tools/check_guards.py` alone: that
      # prover runs one test at a time to watch it go red, parallelism means
      # nothing to it, and the scheme setting would have taken the
      # `Executed N tests` line away from all 60-odd of its Swift entries.
      #
      # -parallel-testing-worker-count from the machine's own core count.
      #
      # This said "no worker count: the default is the runner's core count",
      # which was wrong and is the reason the number is measured here now. The
      # first parallel run on this runner used TWO worker processes, counted off
      # its own transcript, so xcodebuild's default is not the core count and a
      # sentence asserting it was doing the sizing (L316).
      #
      # Computed on the machine rather than written down, so the laptop that
      # runs the same command through `make test-swift` and the runner each get
      # their own number and neither is a constant that is wrong for the other.
      # The count is echoed beside the core count, so the next reader can see
      # what it actually ran on instead of trusting this comment (L210).
      #
      # -resultBundlePath because a parallel run prints NO executed-tests total
      # at all, and its per-test lines are written to one stdout by every worker
      # and interleave: one was corrupted mid-write on the first run anybody
      # tried, undercounting by 1 in 2,614. The bundle is written through the
      # test framework instead, and suite_counts.py clears it first because
      # xcodebuild refuses to run when the path already exists.
      - name: Run the Swift unit tests
        if: steps.already.outputs.run != 'false'
        run: |
          workers="$(sysctl -n hw.ncpu)"
          echo "::notice::Swift suite on ${workers} workers, ${workers} cores"
          python3 tools/suite_counts.py run swift \
            --result-bundle PostRollApp/.derived-data/swift-suite.xcresult -- \
            xcodebuild \
              -project PostRollApp/PostRoll.xcodeproj \
              -scheme PostRollTests \
              -destination 'platform=macOS' \
              -derivedDataPath PostRollApp/.derived-data \
              -resultBundlePath PostRollApp/.derived-data/swift-suite.xcresult \
              -parallel-testing-enabled YES \
              -parallel-testing-worker-count "${workers}" \
              test

      # Compile the GUI test target, without running it (#874).
      #
      # `make test` and the step above both build the PostRollTests scheme,
      # which does not contain PostRollUITests at all, so nothing local or on a
      # pull request ever compiled the GUI tests. The first thing that did was a
      # runner, and on 2026-08-23 a dispatched GUI run failed at its BUILD step
      # on a concurrency-safety error that any compile would have caught.
      #
      # build-for-testing rather than test, deliberately. Running the GUI tests
      # is what is slow and flaky and what keeps them off pull requests, and
      # none of that applies to compiling them.
      #
      # In this existing job rather than a new one, which is not laziness. A new
      # check name on a pull request can only go green once
      # tests/test_wait_for_checks.py's recorded reply already holds it, and
      # that reply can only be recorded from a green run, so adding one costs a
      # knowingly red merge. Adding a step to a job that already reports buys
      # the same coverage for none of that.
      - name: Compile the GUI tests
        if: steps.already.outputs.run != 'false'
        run: |
          xcodebuild build-for-testing \
            -project PostRollApp/PostRoll.xcodeproj \
            -scheme PostRollUITests \
            -destination 'platform=macOS' \
            -derivedDataPath PostRollApp/.derived-data \
            -quiet
      # What tells a job that DID its work from one this gate skipped (#990).
      #
      # A skipped job still checks out, asks the gate and exits successful in
      # under a minute. That is a positive duration, so tools/check_job_durations.py
      # would read it as this job having become fast and the series would then
      # hold two populations divided by the week's merge pattern rather than by
      # anything about the job (L102, L331). It reads this step's own
      # conclusion instead, under one name shared by every gated job, so there
      # is no per-workflow table to keep in step (L96).
      - name: Confirm this job ran its checks
        # `!cancelled()` rather than nothing, so a job whose checks went RED
        # still counts as time spent. Dropping a red run would hide a job
        # getting slower right up to the moment it fails, which is the
        # direction that matters most, and it is the rule the sweep's proof
        # step already follows. A CANCELLED job is excluded, because its
        # elapsed time measures when somebody stopped it.
        if: ${{ !cancelled() && steps.already.outputs.run != 'false' }}
        run: echo "swift-unit ran its checks on tree $(git rev-parse HEAD^{tree})"
  # The Release build, in a job of its own so it runs BESIDE the tests rather
  # than in front of them (#1242).
  #
  # It was the first of three sequential steps in `swift-unit`, and measured on
  # run 33760431737 it was 194 of that job's 620 seconds, 152.4 of them inside
  # ONE `SwiftCompile` task: Release compiles whole module, which is one
  # indivisible unit of work, and this runner has three cores. Nothing in
  # `swift-unit` consumes what it produces, so the only thing keeping it there
  # was that nobody had moved it.
  #
  # Not a compilation change. Same compiler, same configuration, same flags,
  # same diagnostics, and the same guards still read it: it costs exactly what
  # it cost before, in parallel with the tests instead of ahead of them.
  #
  # Release is not negotiable here and the reason is recorded rather than
  # assumed. Commit 208477c closed a gap in which a `sending 'fm' risks causing
  # data races` error sat on main since #535 with every check green, because CI
  # built Debug while `make install` builds Release.
  #
  # macos-26 for the same reason `swift-unit` uses it: CI's compiler must be at
  # or ahead of the one on the Mac this is written on, never behind.
  release-build:
    runs-on: macos-26
    # A job without a deadline cannot fail, it can only hang (L110). The build
    # is about 200 seconds; this is many times that and will not fail a slow
    # runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Has a green pull request already checked this exact tree? (#990)
      #
      # Every commit on main is a squash merge made by
      # tools/wait_for_checks.py --merge, which refuses a head that does not
      # contain main (exit 6, #680) and merges the exact commit it judged. A
      # squash of a head containing its base produces the head's tree byte for
      # byte, so the steps below would re-run swift-unit against content it has
      # already passed on. Measured over the 25 most recent merges, each had
      # exactly one associated pull request and the trees matched 25 times out
      # of 25; measured over the last 24 pushes to main, the jobs this gate can
      # skip are 23 macOS runner-minutes per merge.
      #
      # A step rather than a job on purpose. A new job is a new CHECK NAME, and
      # tools/wait_for_checks.py derives the bar a pull request has to clear
      # from these workflow files, calibrated against a recorded reply from a
      # real green pull request. Adding a name means a run carrying it can only
      # go green once the fixture already holds it, so there is no green run to
      # record from and breaking the loop costs a knowingly red merge (L48).
      #
      # `push` only. On a pull request this must never fire: an up-to-date
      # branch can carry the same tree as its own head, so a re-run would find
      # the previous run's green and skip the very check the merge is judged by.
      #
      # Every step below asks `!= 'false'` rather than `== 'true'`, so the gate
      # not running at all, or answering nothing, runs the work. Only the one
      # positive answer skips (L98).
      - name: Say whether a green pull request already checked this tree
        id: already
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_tree_already_checked.py --check "release-build"


      # Not the image default. A runner image updates its default Xcode without
      # a commit here, which is how the compiler moved out from under the repo
      # in the first place, so the version is read out of the file that
      # tools/check_toolchain.py holds this Mac to (L25, L41). Absent is a hard
      # failure naming what the image does have: falling back to the default
      # would be the silent drift this step exists to stop.
      - name: Select the recorded Xcode
        if: steps.already.outputs.run != 'false'
        run: |
          version="$(cat PostRollApp/.ci-xcode-version)"
          app="/Applications/Xcode_${version}.app"
          if [ ! -d "${app}" ]; then
            echo "PostRollApp/.ci-xcode-version asks for Xcode ${version}, which is not"
            echo "on this runner image. What it has:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "${app}"
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.already.outputs.run != 'false'
        run: brew install xcodegen

      # The .xcodeproj is generated from project.yml, so CI regenerates it
      # rather than trusting a checked-in copy that may be behind the manifest.
      - name: Generate the Xcode project
        if: steps.already.outputs.run != 'false'
        working-directory: PostRollApp
        run: xcodegen generate
      # The app itself, before the tests. The PostRollTests scheme compiles a
      # hand-listed subset of Sources, so nothing in CI had ever compiled the
      # views: a missing brace in InsightsOverviewView sat on main with every
      # check green, and the app could not be built at all (L3, L88). This is
      # the job that has to notice, because it is the only one with an Xcode.
      #
      # Release, which is the configuration `make install` builds and therefore
      # the only one that reaches Dan's Applications folder. Without naming it
      # this built Debug, and the two compile differently: a data race error
      # that Release refuses and Debug accepts sat on main for three merges with
      # every check green, and was found only when a stale local build cache was
      # deleted and the first clean Release build in weeks failed (#485).
      # Debug still gets compiled either way, by the test scheme below.
      # ONLY_ACTIVE_ARCH=YES, on the CI build only (#993).
      #
      # Release builds universal by default, so this compiled the whole module
      # twice and linked twice. Read off a runner log on 2026-08-30: one
      # whole-module `SwiftCompile normal arm64`, one whole-module `SwiftCompile
      # normal x86_64`, and two `Ld` lines under Release/PostRoll.build. The
      # step was 132s of a 410s job on the pull request critical path.
      #
      # The x86_64 slice runs on no machine this app is installed on, and it is
      # not what this step is for: it exists for the Release-only diagnostics of
      # #485 and #521, which are identical for both slices.
      #
      # HERE ONLY. `make build` and PostRollApp/build-install.sh still build both,
      # because that is the bundle somebody installs, and a universal app built
      # for one architecture runs on one kind of Mac. That failure looks exactly
      # like this speedup and is far worse, so
      # tests/test_ci_builds_one_architecture.py asserts both directions rather
      # than only the one this change is about (L142).
      #
      # Safe only while nothing is architecture-specific, which is true today
      # and is checked rather than promised: that same file fails on any
      # `#if arch` or `#if targetEnvironment` appearing in Sources or Tests, so
      # the exemption has a reviewer (L96, L129).
      - name: Build the app
        if: steps.already.outputs.run != 'false'
        run: |
          xcodebuild \
            -project PostRollApp/PostRoll.xcodeproj \
            -scheme PostRoll \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath PostRollApp/.derived-data \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Confirm this job ran its checks
        # `!cancelled()` rather than nothing, so a job whose checks went RED
        # still counts as time spent. Dropping a red run would hide a job
        # getting slower right up to the moment it fails, which is the
        # direction that matters most, and it is the rule the sweep's proof
        # step already follows. A CANCELLED job is excluded, because its
        # elapsed time measures when somebody stopped it.
        if: ${{ !cancelled() && steps.already.outputs.run != 'false' }}
        run: echo "release-build ran its checks on tree $(git rev-parse HEAD^{tree})"
  # No Xcode work here at all: these render through Python and Pillow and read
  # pixels back out. They need this runner for its FONTS, not for a build, so the
  # job deliberately does not install XcodeGen or compile the app.
  reference-frames:
    name: reference-frames (${{ matrix.shard.name }})
    runs-on: macos-15
    # Per SHARD, which is what a job is here (#832). Each one renders reels and
    # measured 2m29s to 3m19s on 2026-08-22, so this is roughly ten times the
    # real thing: a shard that reaches it is stuck rather than slow.
    timeout-minutes: 30

    # ── why it is fanned out over a matrix (#507) ─────────────────────────────
    #
    # Once every pull request started running this job it became the entire merge
    # wait: about 6m15s against the Swift half's 2m. It was already parallel, so
    # the ceiling was the runner rather than the checks. A standard GitHub macOS
    # runner has 3 cores, so `-n auto` inside one job could only ever divide
    # these files by three.
    #
    # A larger runner is the other way to do it and is deliberately not used:
    # larger runners bill on a private repo, which this one becomes.
    #
    # Three shards since #512, which split the scrolling reel's checks out of
    # test_frame_legibility.py. Until that split the one file was most of the
    # job and nothing could divide it further.
    #
    # #810 is the same move again. Even after #512 that one file was 33.7% of
    # the measured suite and the whole of this shard, so it WAS the floor: no
    # arrangement of three runners could beat a file that cannot be divided
    # across them. Its closing-crossfade block, about two thirds of it, is
    # tests/test_closing_crossfade_legibility.py now, and the floor is a
    # perfect third of the matrix instead, 27.0%.
    #
    # A shard's name is its heaviest file, not a list of what it runs: `goldens`
    # has carried the phone safe area and the story title clamp since #507. That
    # is deliberate here, because these names are CHECK names, and adding or
    # renaming one costs a knowingly red merge (the derived set is calibrated
    # against a recorded green reply in tests/test_wait_for_checks.py, and no
    # green run carrying a new name can exist yet). So the files moved and the
    # three names did not.
    #
    # ── how the balance is decided (#795) ────────────────────────────────────
    #
    # By MEASURED time, not by file count, and the measurement is not written
    # here. It lives in tests/fixtures/test_file_durations.json, recorded by
    # `make record-test-durations` for #766, and
    # tests/test_reference_frame_shards_are_balanced.py reads BOTH this matrix
    # and that record and fails when the two are far apart, naming the split it
    # would suggest.
    #
    # The figures that used to be in this comment are gone rather than updated.
    # They were measured once, before #512 and before #753 changed what several
    # of these files render, and by the time anyone compared them they described
    # a job that no longer existed while reading as a current fact (L32, L41).
    #
    # What the guard compares: a shard's cost is the summed cost of its files,
    # and the job's wall clock is its heaviest shard. It is judged against the
    # best any split COULD do, which is bounded by the largest single file,
    # since a file cannot be divided, and by a perfect third of the total. One
    # file is about a third of the work, so it sets that floor on its own and
    # the current split reaches it exactly.
    #
    # `--dist worksteal` (#783) is deliberately not part of this. It changed how
    # work spreads WITHIN a shard, across the runner's own cores, and not how
    # files are divided BETWEEN them, which is the only thing this matrix
    # decides.
    #
    # Note what changed in #783 and what did not. `-n auto` inside each shard now
    # runs under `--dist worksteal`, set in pyproject.toml, so an idle core takes
    # pending work off a busy one instead of a whole file pinning to one worker.
    # That is worth about half the wall clock on a 12 core Mac. It cannot help a
    # shard whose work is one long test, and it does not change how the FILES are
    # divided here, which is still this matrix.
    #
    # The extra cost is small and worth naming: each shard pays the ~16s of
    # checkout, pip and ffmpeg install again, so the billed minutes go up by
    # about that while the wall clock nearly halves. That matters at the 10x
    # private-repo multiplier, and it is still the cheap way to buy this.
    #
    # Which files each shard runs is read back out of this matrix by
    # tests/ci_workflow.py, and three guards depend on it: every font-gated file
    # has to appear in exactly one shard, or it runs nowhere while CI stays
    # green.
    #
    # These files USED to run here and again in the `macos` job of tests.yml,
    # which runs the whole suite. #571 decided that duplication deliberately and
    # priced it at "about 200s of wall clock and nothing else" because the
    # runners are free on a public repo.
    #
    # They are free in money and not in queue (#995). Measured over the two weeks
    # to 2026-08-30, these shards and that leg together held 28% of this
    # repository's macOS runner-minutes while other jobs waited on GitHub's five
    # concurrent macOS runners, and the nine files here are 1,433s of the suite's
    # 2,050s of recorded test time. Dan decided on that arithmetic on 2026-08-29.
    #
    # So the Mac leg now deselects exactly these files, deriving the list from
    # this matrix through tests/ci_workflow.py rather than repeating it. This is
    # where they run, and it is the STRICTER of the two places: this job sets
    # POSTROLL_REQUIRE_GOLDENS and that one does not, so a missing system face is
    # a failure here and was only ever a silent skip there.
    strategy:
      # One shard going red says nothing about the other, and cancelling it
      # would hide a second failure until the first is fixed and re-run.
      fail-fast: false
      matrix:
        # TWO shards since #1095, not three, and the reason is the account's
        # runner limit rather than anything about these files.
        #
        # GitHub runs five concurrent macOS jobs per ACCOUNT. A pull request
        # here asked for six: swift-unit, three of these, the Mac pytest leg and
        # the guard prover. So one always waited even with nothing else
        # happening, and two pull requests meant twelve jobs against five.
        # Measured on #1093, the clean reading with nothing else in flight, the
        # sixth job waited 163s; on a run with a guard sweep in flight the same
        # shape cost 18m22s, counted off the sweep's own sixth shard. Six into
        # five becomes five into five here, so nothing queues.
        #
        # What this does NOT buy is a faster pull request, and it should not be
        # sold as one. `swift-unit` is the critical path at 528s and this whole
        # leg was finished by 341s, so the queueing landed on a job with 187
        # seconds of slack. Two shards of about 240s each still finish well
        # inside it. Half of swift-unit is compiling rather than testing, and
        # that is where wall clock actually lives.
        #
        # The price is the third runner's cores, which is #507's split partly
        # undone: three shards were three machines' worth of parallelism, and a
        # standard macOS runner has three cores, so `-n auto` inside one job can
        # only divide these files three ways. Paid deliberately, because the
        # slack above says this leg can afford to be slower and the queue says
        # the repository cannot afford the job.
        #
        # The files are dealt by MEASURED cost, largest first, by the same
        # tools/guard_entry_costs.py `deal` #1090 wrote for the guard shards:
        # 715.1s against 717.8s, an imbalance of 1.0019.
        # tests/test_reference_frame_shards_are_balanced.py holds it, and it
        # compares the heaviest shard against the best a split could achieve,
        # so it stays meaningful at two shards without being touched.
        #
        # Both names already existed, and that is deliberate: a name here is a
        # CHECK name, so `thursday-reel` is REMOVED and nothing is added. A
        # shard's name is still its heaviest file.
        shard:
          - name: goldens
            files: tests/test_golden_frames.py tests/test_thursday_reel_legibility.py tests/test_frame_names_its_show.py
          - name: legibility
            files: tests/test_closing_crossfade_legibility.py tests/test_frame_legibility.py tests/test_slider_program_plate.py tests/test_phone_safe_area.py tests/test_gallery_alignment.py tests/test_story_title_clamp.py
    steps:
      - uses: actions/checkout@v5

      # Has a green pull request already checked this exact tree? (#990)
      #
      # Every commit on main is a squash merge made by
      # tools/wait_for_checks.py --merge, which refuses a head that does not
      # contain main (exit 6, #680) and merges the exact commit it judged. A
      # squash of a head containing its base produces the head's tree byte for
      # byte, so the steps below would re-run reference-frames (${{ matrix.shard.name }}) against content it has
      # already passed on. Measured over the 25 most recent merges, each had
      # exactly one associated pull request and the trees matched 25 times out
      # of 25; measured over the last 24 pushes to main, the jobs this gate can
      # skip are 23 macOS runner-minutes per merge.
      #
      # A step rather than a job on purpose. A new job is a new CHECK NAME, and
      # tools/wait_for_checks.py derives the bar a pull request has to clear
      # from these workflow files, calibrated against a recorded reply from a
      # real green pull request. Adding a name means a run carrying it can only
      # go green once the fixture already holds it, so there is no green run to
      # record from and breaking the loop costs a knowingly red merge (L48).
      #
      # `push` only. On a pull request this must never fire: an up-to-date
      # branch can carry the same tree as its own head, so a re-run would find
      # the previous run's green and skip the very check the merge is judged by.
      #
      # Every step below asks `!= 'false'` rather than `== 'true'`, so the gate
      # not running at all, or answering nothing, runs the work. Only the one
      # positive answer skips (L98).
      - name: Say whether a green pull request already checked this tree
        id: already
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_tree_already_checked.py --check "reference-frames (${{ matrix.shard.name }})"


      - name: Set up Python
        if: steps.already.outputs.run != 'false'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        if: steps.already.outputs.run != 'false'
        run: pip install -r requirements.txt

      # The reel references are pulled out of an encoded file, so this is not
      # optional here the way it is for most of the Python suite.
      - name: Install ffmpeg
        if: steps.already.outputs.run != 'false'
        run: brew install ffmpeg

      # Recorded, not just installed (#792, the same record tests.yml keeps
      # since #552). This job is where MAX_CHANGED_FRACTION's reading was taken,
      # and the runner image is pinned while ffmpeg is not: `brew install
      # ffmpeg` takes whatever Homebrew has that day. Without this the number
      # the limit rests on can move with nothing here saying which tool produced
      # it, and a red run cannot be attributed: our own change and ffmpeg having
      # moved underneath us look identical.
      #
      # On every shard, not only the one that compares. All three render through
      # ffmpeg and all three can be moved by it.
      #
      # `test_golden_drift_is_reported.py` derives which jobs need this from
      # which jobs could take a reading, so a third one is covered the day it
      # lands rather than the day somebody remembers this file (L96).
      - name: Record the ffmpeg version this leg ran against
        if: steps.already.outputs.run != 'false'
        run: |
          set -euo pipefail
          {
            echo "### ffmpeg on ${{ runner.os }} (${{ runner.arch }}), shard ${{ matrix.shard.name }}"
            echo '```'
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Collect the drift readings the reference frames take (#787) into one
      # file, then publish it twice below. Into a file rather than straight
      # into the step summary because the readings have two audiences: a
      # person opening the run reads the summary, and anything asking the API
      # what a run measured can only read the LOG, since a step summary is
      # not fetchable.
      #
      # Only on the shard that runs the comparisons. The other two collected
      # nothing and announced it on every run, which is a permanent line rather
      # than news, and a permanent warning is one people learn to read past
      # (#797, L36).
      #
      # Selected by the FILE the shard runs, not by the shard's name. A name
      # here would be a second copy of the split above, so rebalancing the
      # matrix would move the comparisons to another shard and leave these two
      # steps behind, collecting where nothing measures (L41).
      # tests/test_golden_drift_is_reported.py evaluates this condition against
      # the real matrix and fails when the two disagree.
      - name: Collect reference-frame drift readings
        if: contains(matrix.shard.files, 'tests/test_golden_frames.py') && steps.already.outputs.run != 'false'
        run: echo "POSTROLL_GOLDEN_DRIFT_LOG=${RUNNER_TEMP}/golden-drift.txt" >> "${GITHUB_ENV}"

      # Both variables turn a skip into a hard failure. A reference-frame check
      # that quietly skips for want of ffmpeg or a system font is
      # indistinguishable from one that passed, which is the whole failure mode
      # this job exists to close. -ra reports any skip that does remain.
      #
      # test_frame_legibility.py was missing here until 2026-08-11. It carries
      # the checks that read text back out of an encoded reel (#298) and the
      # scrolling colophon check (#306), every one of them font-gated, so they
      # skipped on Linux and were never invoked on the Mac. Both were proven on
      # Dan's machine and neither was wired (L3): they had never run in CI.
      #
      # test_gallery_alignment.py was missed by the FIRST version of that fix,
      # because it defines its own font-gate marker under a different name and
      # the guard was matching one remembered spelling. Four more checks were
      # running nowhere, including the only pixel-level test of the slider's
      # labels. The guard now matches the shape of the name instead:
      # tests/test_ci_runs_the_font_dependent_checks.py.
      - name: Run the reference-frame and legibility checks
        if: steps.already.outputs.run != 'false'
        env:
          POSTROLL_REQUIRE_FFMPEG: "1"
          POSTROLL_REQUIRE_GOLDENS: "1"
      #
      # `-n auto` divides a shard across the cores of the runner it landed on,
      # the matrix above divides the files across runners, and the two multiply.
      # Safe to parallelise because every test here writes only into pytest's
      # per-test tmp_path, and `tests/conftest.py` fails any module that writes
      # into the source tree at all (#497), so that is enforced rather than
      # remembered. `auto` rather than a fixed count so it follows the runner
      # rather than this Mac.
      #
      # The files come from the matrix, not from this line. A hardcoded list here
      # would leave the matrix fanning the job out while every copy ran the same
      # thing, which is why a guard asserts this interpolation exists.
        run: >
          pytest ${{ matrix.shard.files }}
          -n auto -v -ra

      # Both audiences, and on a failed run too: a red run is when the numbers
      # are most worth having, and a step that only ran on success would drop
      # them exactly then. A run that collected NOTHING says so rather than
      # publishing an empty list, which would read as a run in which nothing
      # drifted (L98).
      - name: Publish the reference-frame drift readings
        if: always() && contains(matrix.shard.files, 'tests/test_golden_frames.py') && steps.already.outputs.run != 'false'
        run: |
          set -euo pipefail
          if [ ! -s "${POSTROLL_GOLDEN_DRIFT_LOG:-/nonexistent}" ]; then
            echo "no reference-frame drift readings were taken, so this run measured nothing"
            exit 0
          fi
          echo "### reference-frame drift: pixels differing from the committed frame by more than the per-channel tolerance, as a share of the canvas (#787)" >> "${GITHUB_STEP_SUMMARY}"
          cat "${POSTROLL_GOLDEN_DRIFT_LOG}" >> "${GITHUB_STEP_SUMMARY}"
          cat "${POSTROLL_GOLDEN_DRIFT_LOG}"


      # What tells a job that DID its work from one this gate skipped (#990).
      #
      # A skipped job still checks out, asks the gate and exits successful in
      # under a minute. That is a positive duration, so tools/check_job_durations.py
      # would read it as this job having become fast and the series would then
      # hold two populations divided by the week's merge pattern rather than by
      # anything about the job (L102, L331). It reads this step's own
      # conclusion instead, under one name shared by every gated job, so there
      # is no per-workflow table to keep in step (L96).
      - name: Confirm this job ran its checks
        # `!cancelled()` rather than nothing, so a job whose checks went RED
        # still counts as time spent. Dropping a red run would hide a job
        # getting slower right up to the moment it fails, which is the
        # direction that matters most, and it is the rule the sweep's proof
        # step already follows. A CANCELLED job is excluded, because its
        # elapsed time measures when somebody stopped it.
        if: ${{ !cancelled() && steps.already.outputs.run != 'false' }}
        run: echo "reference-frames (${{ matrix.shard.name }}) ran its checks on tree $(git rev-parse HEAD^{tree})"
