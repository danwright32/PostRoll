name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A pull request cancels its own superseded run rather than paying for a commit
# nobody will merge (#430). A push to main gets a group of its own keyed by SHA,
# so consecutive merges neither cancel nor queue behind one another. The macOS
# workflow carries the same block, for the same reason.
#
# (Naming that other workflow's filename here is deliberately avoided:
# `test_ci_gates.py` asserts this file mentions nothing of the sort, which is how
# it catches that job being moved back in to run twice at double the cost.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    # A deadline, because a job without one cannot fail, it can only hang, and a
    # hang looks exactly like a slow queue (#832). This job wedged twice on one
    # commit on 2026-08-22 and ran 45 minutes before it was cancelled by hand.
    # Sized from what it really costs: 2m49s, 3m23s and 3m25s measured that day,
    # so this is about six times the real thing and will not fail a slow runner.
    timeout-minutes: 20
    # Enough to file the one issue this job opens when it goes red (#1011).
    #
    # At JOB level rather than on the step, because a step's own `permissions:`
    # is not a thing GitHub honours: writing it there reads as a restriction and
    # applies none.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      # Has a green pull request already checked this exact tree? (#990)
      #
      # Every commit on main is a squash merge made by
      # tools/wait_for_checks.py --merge, which refuses a head that does not
      # contain main (exit 6, #680) and merges the exact commit it judged. A
      # squash of a head containing its base produces the head's tree byte for
      # byte, so the steps below would re-run python against content it has
      # already passed on. Measured over the 25 most recent merges, each had
      # exactly one associated pull request and the trees matched 25 times out
      # of 25; measured over the last 24 pushes to main, the jobs this gate can
      # skip are 23 macOS runner-minutes per merge.
      #
      # A step rather than a job on purpose. A new job is a new CHECK NAME, and
      # tools/wait_for_checks.py derives the bar a pull request has to clear
      # from these workflow files, calibrated against a recorded reply from a
      # real green pull request. Adding a name means a run carrying it can only
      # go green once the fixture already holds it, so there is no green run to
      # record from and breaking the loop costs a knowingly red merge (L48).
      #
      # `push` only. On a pull request this must never fire: an up-to-date
      # branch can carry the same tree as its own head, so a re-run would find
      # the previous run's green and skip the very check the merge is judged by.
      #
      # Every step below asks `!= 'false'` rather than `== 'true'`, so the gate
      # not running at all, or answering nothing, runs the work. Only the one
      # positive answer skips (L98).
      - name: Say whether a green pull request already checked this tree
        id: already
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_tree_already_checked.py --check "python"


      # `cache: pip` keys the wheel cache on requirements.txt, which is pinned
      # exactly (test_ci_gates.py holds that true), so a restore can only ever
      # be the same wheels this run asked for (#430).
      - name: Set up Python
        if: steps.already.outputs.run != 'false'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.already.outputs.run != 'false'
        run: pip install -r requirements.txt

      # Static checks before the suite: a syntax error or an undefined name is
      # cheaper to hear about in seconds than after a five minute test run
      # (#113). The rule set is deliberately narrow, real defects rather than
      # style opinions, so it can be enforced rather than ignored.
      - name: Lint
        if: steps.already.outputs.run != 'false'
        run: ruff check .

      # Installed explicitly rather than inherited from whatever the runner
      # image happens to ship (#106). The end-to-end audio and reel tests skip
      # without it, and a silent skip in CI is indistinguishable from a pass.
      # What is cached is the .deb files, not the installed state: fetching them
      # is the slow part, about 25s of every run (#430). The key carries the
      # runner image, because the package versions belong to it, so an image
      # bump re-downloads instead of trying to install packages built for the
      # last one.
      - name: Restore the ffmpeg packages
        if: steps.already.outputs.run != 'false'
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}

      # Every path here ends in a real install or a non-zero exit. A cache miss,
      # or a cached set dpkg refuses, falls through to exactly the clean install
      # this step used to do, so the worst case is the speed it has today rather
      # than a job that fails for want of a cache. The verification step below is
      # what makes that safe to assume rather than hope: it is the guard on a bad
      # restore, and a silent skip for want of ffmpeg is the whole failure mode
      # this install exists to close (#106).
      - name: Install ffmpeg
        if: steps.already.outputs.run != 'false'
        run: |
          set -euo pipefail
          install_from_apt() {
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          }
          if compgen -G "$HOME/ffmpeg-debs/*.deb" > /dev/null; then
            echo "Installing ffmpeg from the cached packages."
            sudo dpkg -i "$HOME"/ffmpeg-debs/*.deb || {
              echo "The cached packages did not install; falling back to a clean install."
              install_from_apt
            }
          else
            echo "No cached packages yet: fetching them."
            sudo apt-get update
            sudo apt-get install -y --download-only ffmpeg
            mkdir -p "$HOME/ffmpeg-debs"
            sudo cp /var/cache/apt/archives/*.deb "$HOME/ffmpeg-debs/"
            sudo chown -R "$(id -u):$(id -g)" "$HOME/ffmpeg-debs"
            sudo apt-get install -y ffmpeg
          fi

      # Recorded, not just checked (#552). Both legs install whatever ffmpeg is
      # current on the day, and the Mac leg exists specifically to catch
      # differences in ffmpeg builds and codecs between the platforms. With the
      # version discarded, a red run cannot be attributed: our own change and
      # ffmpeg having moved underneath us look identical, and the reflex is to
      # read the diff, which is where the answer will not be. The presence check
      # already produced this text; this keeps it.
      - name: Confirm ffmpeg is actually here
        if: steps.already.outputs.run != 'false'
        run: ffmpeg -version && ffprobe -version

      - name: Record the ffmpeg version this leg ran against
        if: steps.already.outputs.run != 'false'
        run: |
          set -euo pipefail
          {
            echo "### ffmpeg on ${{ runner.os }} (${{ runner.arch }})"
            echo '```'
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # POSTROLL_REQUIRE_FFMPEG turns the skip into a hard failure, so the
      # tests cannot quietly stop running if a future image drops ffmpeg.
      # -ra reports every skip that does remain, so none is invisible.
      - name: Run tests
        if: steps.already.outputs.run != 'false'
        env:
          POSTROLL_REQUIRE_FFMPEG: "1"
        # No PYTHONPATH prefix: pyproject.toml puts the repo root on the path
        # and points pytest at tests/, so a local run and a CI run are the same
        # command (#114).
        #
        # `--durations=25` prints the slowest tests of every run on both legs
        # (#562). The Mac leg takes roughly four times the Linux one, and with
        # `-v` alone neither leg said where any of that went, so answering it
        # meant pushing a throwaway commit to measure. It stays on for the same
        # reason the ffmpeg version is recorded above: a number nobody can
        # reproduce off an ordinary run is not evidence.
        #
        # `-n auto` on a 4 vCPU runner takes this from 169s to roughly 70 to 100s
        # (#431). Only safe since #497: the design fingerprint guards used to
        # write perturbed copies of real modules into the source tree and restore
        # them, so a worker hashing one of those files mid-perturbation reported a
        # redesign that never happened. They work on a copy in tmp_path now, and
        # `tests/conftest.py` fails any module that writes into the source tree,
        # so the precondition is enforced rather than assumed. Proven by two clean
        # full-suite parallel runs before this landed.
        run: pytest -v -n auto --durations=25

  # The same suite on a Mac, which is the platform the app that calls it runs
  # on (#510). Everything above this runs on Linux only, so anything that
  # differs between the two stays invisible until it is hit locally: path and
  # filename handling, the ffmpeg build and its codecs, font fallbacks, and a
  # case insensitive filesystem. The repo has been bitten in the other
  # direction already, by a BSD only shell form that passed on Dan's Mac and
  # failed on every Linux run.
  #
  # On pull requests as well as main, decided on evidence rather than on
  # principle (#550).
  #
  # This ran on merges to main only for exactly one day. On 2026-08-14 it found
  # a real platform difference on its first run, and the pull request carrying
  # that change reported 5 passed / 0 failed the whole time, because a job gated
  # off pull requests is not in the rollup a merge is judged by. It merged, main
  # went red, and the failure arrived by email instead of by the check that
  # exists to prevent it. A check that cannot run before the merge cannot stop
  # the merge, and a skipped job reads exactly like a passing one (L98).
  #
  # Measured before promoting: 10m42s on the runner, against 1m55s for the Linux
  # leg. This repository is public, so the standard runners cost nothing to run
  # and the price is wall clock on a pull request, which is the trade taken.
  #
  # Why this takes roughly four times the Linux leg, measured 2026-08-14 with
  # `--durations` on both, so nobody has to guess at it again (#562):
  #
  # It is not slower. It runs strictly more. Linux skips 31 tests for want of
  # HelveticaNeue and SignPainter, and those 31 are the whole reel-rendering
  # suite: the 18 slowest of them come to 581 CPU-seconds here, against a
  # slowest single test of 9.29s over there. On the tests BOTH legs run, this
  # one is about 20% FASTER per test. The 3 cores against Linux's 4 is a minor
  # part of it and the composition is nearly all of it.
  #
  # Those five files also run in swift.yml's `reference-frames` job, sharded
  # across three runners, so the reel suite renders twice per pull request.
  # That is deliberate and was decided rather than overlooked (#571). The two
  # runs are not the same run: the sharded one exists so `-n auto` can use more
  # than one runner's three cores, and this one exists so the Mac leg runs the
  # SAME command as Linux, which is the property #510 and #550 were about and
  # which two earlier attempts at narrowing already broke. The runners are free
  # on a public repo, so the duplication costs about 200s of wall clock and
  # nothing else, and it buys a second run of the most expensive and most
  # visual part of the suite. Do not re-open it on the strength of the wall
  # clock alone.

      # What tells a job that DID its work from one this gate skipped (#990).
      #
      # A skipped job still checks out, asks the gate and exits successful in
      # under a minute. That is a positive duration, so tools/check_job_durations.py
      # would read it as this job having become fast and the series would then
      # hold two populations divided by the week's merge pattern rather than by
      # anything about the job (L102, L331). It reads this step's own
      # conclusion instead, under one name shared by every gated job, so there
      # is no per-workflow table to keep in step (L96).
      # A red run here reaches nobody otherwise (#1011).
      #
      # This runs on push to main as well as on a pull request, and the push run is after the merge has landed.
      #
      # It speaks only on a FAILURE. A notice on every green run is what teaches
      # a person to skip the whole list (L36). It also asks the tree gate, because every step after that gate has to: a job whose work was skipped as already proved has nothing that could have failed, and a step ignoring the gate runs on every merge whatever the gate decided.
      #
      # A step rather than a job, because a new job is a new CHECK NAME and
      # tests/test_wait_for_checks.py calibrates the names it waits for against
      # a recorded reply from a real pull request (L305).
      - name: Say so if this run went red
        if: failure() && github.event_name == 'push' && steps.already.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/say_when_ci_goes_red.py \
            --workflow tests.yml \
            --job "python" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Confirm this job ran its checks
        # `!cancelled()` rather than nothing, so a job whose checks went RED
        # still counts as time spent. Dropping a red run would hide a job
        # getting slower right up to the moment it fails, which is the
        # direction that matters most, and it is the rule the sweep's proof
        # step already follows. A CANCELLED job is excluded, because its
        # elapsed time measures when somebody stopped it.
        if: ${{ !cancelled() && steps.already.outputs.run != 'false' }}
        run: echo "python ran its checks on tree $(git rev-parse HEAD^{tree})"
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    # Enough to file the one issue this job opens when it goes red (#1011).
    #
    # At JOB level rather than on the step, because a step's own `permissions:`
    # is not a thing GitHub honours: writing it there reads as a restriction and
    # applies none.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      # Has a green pull request already checked this exact tree? (#990)
      #
      # Every commit on main is a squash merge made by
      # tools/wait_for_checks.py --merge, which refuses a head that does not
      # contain main (exit 6, #680) and merges the exact commit it judged. A
      # squash of a head containing its base produces the head's tree byte for
      # byte, so the steps below would re-run macos against content it has
      # already passed on. Measured over the 25 most recent merges, each had
      # exactly one associated pull request and the trees matched 25 times out
      # of 25; measured over the last 24 pushes to main, the jobs this gate can
      # skip are 23 macOS runner-minutes per merge.
      #
      # A step rather than a job on purpose. A new job is a new CHECK NAME, and
      # tools/wait_for_checks.py derives the bar a pull request has to clear
      # from these workflow files, calibrated against a recorded reply from a
      # real green pull request. Adding a name means a run carrying it can only
      # go green once the fixture already holds it, so there is no green run to
      # record from and breaking the loop costs a knowingly red merge (L48).
      #
      # `push` only. On a pull request this must never fire: an up-to-date
      # branch can carry the same tree as its own head, so a re-run would find
      # the previous run's green and skip the very check the merge is judged by.
      #
      # Every step below asks `!= 'false'` rather than `== 'true'`, so the gate
      # not running at all, or answering nothing, runs the work. Only the one
      # positive answer skips (L98).
      - name: Say whether a green pull request already checked this tree
        id: already
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_tree_already_checked.py --check "macos"


      - name: Set up Python
        if: steps.already.outputs.run != 'false'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.already.outputs.run != 'false'
        run: pip install -r requirements.txt

      # Same reason as the Linux leg: a silent skip for want of ffmpeg is
      # indistinguishable from a pass, so it is installed rather than hoped for.
      - name: Install ffmpeg
        if: steps.already.outputs.run != 'false'
        run: brew install ffmpeg

      # The same record as the Linux leg (#552). This is the half that makes the
      # comparison possible: two legs whose ffmpeg versions are both unrecorded
      # cannot tell a platform difference from a version difference, which is
      # the one question this job exists to answer.
      - name: Confirm ffmpeg is actually here
        if: steps.already.outputs.run != 'false'
        run: ffmpeg -version && ffprobe -version

      - name: Record the ffmpeg version this leg ran against
        if: steps.already.outputs.run != 'false'
        run: |
          set -euo pipefail
          {
            echo "### ffmpeg on ${{ runner.os }} (${{ runner.arch }})"
            echo '```'
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The reference-frame drift readings (#787) are NOT collected here any
      # more. This leg no longer renders those files at all since #995: the
      # shards in swift.yml do, and they collect the readings. Left in place,
      # the publishing step below would report "no readings were taken, so this
      # run measured nothing" on every single run. That sentence exists to catch
      # a broken run (L98), and a warning that fires every time is one nobody
      # reads (L36).

      # The Linux leg's command, minus the files the reference-frame matrix in
      # swift.yml already renders (#995).
      #
      # This used to say "the SAME command as the Linux leg. A narrower one here
      # would make this job a different check wearing the same name, and the
      # platform differences it exists to catch are exactly the ones a subset
      # drops." That argument is about narrowing by GUESS. What is dropped here
      # is not a guess: it is exactly the set of files another macOS job renders,
      # on the same image, with fonts and ffmpeg, and with POSTROLL_REQUIRE_GOLDENS
      # set, which this job does not set. Those files are checked more strictly
      # there than here, so running them twice bought nothing.
      #
      # #571 recorded the duplication as deliberate and priced it at "about 200s
      # of wall clock and nothing else" because the runners are free. They are
      # free in money. Measured over the two weeks to 2026-08-30 they are not
      # free in queue: these two jobs held 28% of the macOS runner-minutes while
      # other jobs waited, and this leg held a runner for 8.5 minutes on every
      # pull request and merge. The nine files are 1,433s of the suite's 2,050s
      # of recorded test time, 70% of it. Dan decided on that arithmetic on
      # 2026-08-29.
      #
      # The list is DERIVED from the matrix at run time rather than written here.
      # A copy would drift, and the bad direction is silent: a file dropped from
      # the matrix and still ignored here runs in neither place, with both sides
      # believing the other has it (L41). tests/ci_workflow.py raises rather than
      # printing an empty list, so a derivation that broke fails this step
      # instead of quietly restoring the whole suite (L98), and the count is
      # echoed so a reader can see what it actually skipped.
      - name: Run tests
        if: steps.already.outputs.run != 'false'
        env:
          POSTROLL_REQUIRE_FFMPEG: "1"
        run: |
          set -euo pipefail
          python tests/ci_workflow.py --pytest-ignore > "${RUNNER_TEMP}/ignore.txt"
          echo "not re-rendering $(wc -l < "${RUNNER_TEMP}/ignore.txt" | tr -d ' ') files the reference-frame shards already render:"
          cat "${RUNNER_TEMP}/ignore.txt"
          xargs pytest -v -n auto --durations=25 < "${RUNNER_TEMP}/ignore.txt"

      # What tells a job that DID its work from one this gate skipped (#990).
      #
      # A skipped job still checks out, asks the gate and exits successful in
      # under a minute. That is a positive duration, so tools/check_job_durations.py
      # would read it as this job having become fast and the series would then
      # hold two populations divided by the week's merge pattern rather than by
      # anything about the job (L102, L331). It reads this step's own
      # conclusion instead, under one name shared by every gated job, so there
      # is no per-workflow table to keep in step (L96).
      # A red run here reaches nobody otherwise (#1011).
      #
      # Same as the job above.
      #
      # It speaks only on a FAILURE. A notice on every green run is what teaches
      # a person to skip the whole list (L36). It also asks the tree gate, because every step after that gate has to: a job whose work was skipped as already proved has nothing that could have failed, and a step ignoring the gate runs on every merge whatever the gate decided.
      #
      # A step rather than a job, because a new job is a new CHECK NAME and
      # tests/test_wait_for_checks.py calibrates the names it waits for against
      # a recorded reply from a real pull request (L305).
      - name: Say so if this run went red
        if: failure() && github.event_name == 'push' && steps.already.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/say_when_ci_goes_red.py \
            --workflow tests.yml \
            --job "macos" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Confirm this job ran its checks
        # `!cancelled()` rather than nothing, so a job whose checks went RED
        # still counts as time spent. Dropping a red run would hide a job
        # getting slower right up to the moment it fails, which is the
        # direction that matters most, and it is the rule the sweep's proof
        # step already follows. A CANCELLED job is excluded, because its
        # elapsed time measures when somebody stopped it.
        if: ${{ !cancelled() && steps.already.outputs.run != 'false' }}
        run: echo "macos ran its checks on tree $(git rev-parse HEAD^{tree})"
