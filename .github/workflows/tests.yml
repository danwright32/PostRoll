name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Static checks before the suite: a syntax error or an undefined name is
      # cheaper to hear about in seconds than after a five minute test run
      # (#113). The rule set is deliberately narrow, real defects rather than
      # style opinions, so it can be enforced rather than ignored.
      - name: Lint
        run: ruff check .

      # Installed explicitly rather than inherited from whatever the runner
      # image happens to ship (#106). The end-to-end audio and reel tests skip
      # without it, and a silent skip in CI is indistinguishable from a pass.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Confirm ffmpeg is actually here
        run: ffmpeg -version && ffprobe -version

      # POSTROLL_REQUIRE_FFMPEG turns the skip into a hard failure, so the
      # tests cannot quietly stop running if a future image drops ffmpeg.
      # -ra reports every skip that does remain, so none is invisible.
      - name: Run tests
        env:
          POSTROLL_REQUIRE_FFMPEG: "1"
        # No PYTHONPATH prefix: pyproject.toml puts the repo root on the path
        # and points pytest at tests/, so a local run and a CI run are the same
        # command (#114).
        run: pytest -v

  # The Swift suites (data safety, crop parity, media path integrity, stored
  # error policy) were never executed by CI, so every one of them was unenforced
  # (#82). Runs the PostRollTests scheme, not the PostRoll scheme, so the
  # GUI-driving PostRollUITests target is excluded: a headless runner cannot
  # reliably drive XCUIApplication.
  #
  # This repo is private, where macOS runner minutes bill at a 10x multiplier,
  # so the job is scoped to pushes on main and manual runs rather than every
  # push to every branch. Pull requests skip it deliberately.
  swift:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is generated from project.yml, so CI regenerates it
      # rather than trusting a checked-in copy that may be behind the manifest.
      - name: Generate the Xcode project
        working-directory: PostRollApp
        run: xcodegen generate

      - name: Run the Swift unit tests
        run: |
          xcodebuild \
            -project PostRollApp/PostRoll.xcodeproj \
            -scheme PostRollTests \
            -destination 'platform=macOS' \
            test
