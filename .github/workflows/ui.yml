name: GUI

# Can the app actually be driven on a runner? (#849)
#
# `PostRollApp.swift` is excluded from the unit test bundle, correctly: a test
# bundle is loaded into a host that already has an entry point. The cost is that
# nothing in the suite can RUN it, and its only cover is guards matching its
# TEXT. #842 hid exactly there, and was found by installing the build and
# counting windows by hand.
#
# #509 deleted the previous UI target on the recorded grounds that "a headless
# runner cannot reliably drive XCUIApplication". That was written on 2026-06-11,
# nothing had re-checked it since, and it is the premise that decides whether
# the entry point can ever have a reviewer at all, so it was measured rather
# than inherited (L61).
#
# It is false on this image. Measured on macos-26 on 2026-08-23: `launchctl
# managername` answers Aqua, the console user is the runner itself, the app
# launches, and both tests pass in about nine seconds inside a job that finishes
# in a little over two minutes. The premise was true of some runner at some
# point; it is not true of this one.
#
# ── re-judged on 2026-08-23, and kept (#867) ─────────────────────────────────
#
# #849 built this target on the basis that a UI test launching the real app
# could answer three things: window counts, sheet contents, and whether a key
# press commits. Two of the three turned out to be unreachable, and five of the
# seven tests written for it were deleted as a result (#860). A decision resting
# on a premise now known to be two thirds wrong should be re-examined rather
# than inherited (L61), so it was.
#
# It stays, for one reason. `PostRollApp.swift` is excluded from the unit bundle,
# correctly, so the two checks left here are the only things in the repo that
# RUN the entry point. #842 is what that costs when nothing does: the app
# declared the wrong scene type, every unit test passed, and it was found by
# installing the build and counting windows by hand.
#
# The two cheaper alternatives were considered and neither replaces it. A source
# guard asserting the scene type would have caught #842 specifically, and would
# catch nothing about a scene declared correctly that behaves wrongly, which is
# the same text-matching cover that let #842 through in the first place. The
# hand check (#866) does cover the window count, and only when somebody runs it;
# it is the right home for the questions nothing can reach, not for the one
# question something can.
#
# What made this worth keeping rather than merely defensible is that the cost
# came down. Measured on the runner on 2026-08-23: 84.7 seconds of test time in
# a job of about 150 when each test started and ended its own app, against 4.0
# seconds in a job of 101 now that the class shares one. A control on main,
# still launching per test, dispatched onto the same image 25 minutes later,
# came back at 87.2 seconds in a job of 171, so the saving is the change rather
# than the runner. #864 has the numbers.
#
# ── why this never runs on a pull request ────────────────────────────────────
#
# Two reasons, and either alone would be enough.
#
# A UI test is slow and flaky by nature, and the macOS runner already carries
# about eleven minutes of work that every pull request waits on. A flake here
# must not be able to fail the fast suite.
#
# The second is mechanical. `tools/wait_for_checks.py` derives the checks it
# waits for from the workflows that trigger on `pull_request`, and
# `tests/test_wait_for_checks.py` calibrates that set against a reply recorded
# from a real green pull request. A new check name on a pull request can only be
# green once the fixture already holds it, and the fixture can only be recorded
# from a green run, so adding one takes a knowingly red merge. That is a
# deliberate cost to pay on purpose, not a side effect of adding a test.
on:
  workflow_dispatch:
  # Every merge, so the entry point has a reviewer that actually runs rather
  # than one somebody has to remember to invoke (L27). It reports after the
  # merge rather than gating it, which is the trade being made: a defect here is
  # caught within minutes of landing instead of before, and in exchange no
  # pull request waits on a GUI test and no new required check has to be
  # bootstrapped.
  #
  # Nightly was considered and rejected as the cheaper option: work here lands
  # in bursts, so a nightly run reports a morning defect at three the next
  # morning while costing a run on every quiet day too.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    # The same image as swift-unit, for the same reason: CI's compiler must be
    # at or ahead of the one on the development Mac, never behind (#528).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select the recorded Xcode
        run: |
          version="$(cat PostRollApp/.ci-xcode-version)"
          app="/Applications/Xcode_${version}.app"
          if [ ! -d "${app}" ]; then
            echo "PostRollApp/.ci-xcode-version asks for Xcode ${version}, which is not"
            echo "on this runner image. What it has:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "${app}"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: PostRollApp
        run: xcodegen generate

      # Whether there is a window server session to draw into at all, asked
      # before anything tries to use one. A UI test that cannot launch reports a
      # timeout that reads like a slow app, so the answer is taken first and
      # printed plainly.
      - name: Say what kind of session this runner is
        run: |
          echo "user: $(id -un)"
          echo "console user: $(stat -f%Su /dev/console || echo unknown)"
          echo "launchctl session:"
          launchctl managername || true

      - name: Run the GUI tests
        run: |
          xcodebuild \
            -project PostRollApp/PostRoll.xcodeproj \
            -scheme PostRollUITests \
            -destination 'platform=macOS' \
            -derivedDataPath PostRollApp/.derived-data \
            test
