name: Record the Swift suite count

# `tools/suite_counts.py` refuses a Swift leg that ran far fewer tests than the
# suite is known to hold, deriving the floor from
# tests/fixtures/swift_suite_count.json with a 2% tolerance. Nothing re-recorded
# that number (#1261). It said 2,599, measured 2026-08-29, while the suite ran
# 2,965 on 2026-09-04, so the floor was 2,547 and a run could silently lose 418
# tests, 14% of the suite, and still be waved through as full.
#
# Losing a worker's share is precisely the failure parallel testing adds, and a
# floor that drifts down as the suite grows away from it reads as an active
# safeguard while refusing less and less (L182). Re-recording it was one command
# somebody had to remember to type, which is a rule living in a comment (L27).
#
# Same shape as record-guard-costs.yml, which fixed the same drift for the guard
# cost record in #1099.
#
# No pull_request trigger, deliberately. wait_for_checks.py derives the bar from
# the workflow files, and a new check name can only go green once its recorded
# reply already holds it, so adding one costs a knowingly red merge (#1074, L48).
#
# When the Swift suite FINISHES, never at a clock time. Two scheduled jobs
# cannot be ordered by arithmetic between their crons, because GitHub delays
# scheduled work by hours under load (L386, #1262).
#
# The workflow is named rather than referenced, because that is all
# `workflow_run` offers, and the test beside this reads the name out of
# swift.yml rather than trusting the copy here: a name that matches nothing
# fires never, and a workflow that never runs looks exactly like one with
# nothing to do (L100, L98).
on:
  workflow_run:
    workflows: ["macOS"]
    types: [completed]
  workflow_dispatch:

jobs:
  record:
    # ubuntu, not a Mac. This reads a finished run's log through gh and writes
    # one small file; nothing here needs Xcode, and a macOS runner bills at ten
    # times the rate (#1246, L306).
    runs-on: ubuntu-latest
    # Only a run that went green. A run that failed may have stopped early, and
    # a floor pinned to how far a broken run got is refused by nothing forever
    # after (L182). A dispatched run carries no `workflow_run` context at all,
    # so it is admitted by its own name, or the manual trigger would be a
    # control that does nothing (L109).
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    # A job without a deadline cannot fail, it can only hang (L110, L313). This
    # reads one log and writes one file.
    timeout-minutes: 20
    permissions:
      issues: write
      contents: write
      pull-requests: read
      actions: read
    # At JOB level rather than on the step that uses it, because a step's own
    # `env:` is not in scope in that step's own `if:`, and the whole point of
    # the condition below is to skip cleanly when the secret is absent.
    env:
      RECORD_UPDATE_TOKEN: ${{ secrets.RECORD_UPDATE_TOKEN }}
    steps:
      # With the token the proposal is OPENED with, so the push inside
      # tools/propose_recorded_change.sh carries it too. `actions/checkout`
      # persists its credentials for the whole job, and that push uses them.
      #
      # Both halves have to run as ONE actor. `gh pr create` already uses the
      # token, so opening the proposal is attributed to a person and its checks
      # run. Pushing an UPDATE to that same branch with the default token is
      # attributed to github-actions[bot], and GitHub holds those runs at
      # `action_required`, so the pull request reports no checks at all, which
      # reads exactly like checks that have not started yet (#1390, L403).
      #
      # It only ever shows on a RE-push, which is the run carrying the newest
      # measurement, and the branch is named for the day precisely so that a
      # second run of the day meets the first one's branch (L393).
      #
      # Falls back to the default token where the secret is absent, which is
      # the state the propose step below already skips on, so a missing secret
      # still checks out rather than failing the whole job.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RECORD_UPDATE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Through the recorder, never by writing the record here. Every refusal
      # lives in that tool: a run that cannot be looked up, a log with no count,
      # a log carrying two counts that disagree, a count of zero, and a record
      # the floor is still perfectly happy with. A step that wrote the record
      # itself would carry none of them.
      #
      # Its three outcomes are three exit codes, and only one of them is red
      # (L11, L13). Exit 3 is "CI answered and every run it named had skipped
      # the suite", which is swift-unit working as designed on a push whose
      # tree a pull request already checked, so it is let through: a workflow
      # that went red on an ordinary quiet stretch is the noise that teaches
      # everybody to ignore it (L36). Exit 1 is "CI could not be asked", which
      # means the recorder is blind and nothing can say whether the floor has
      # gone slack, and that fails the job rather than being summarised.
      #
      # NOT `continue-on-error`, which the guard cost recorder uses. That
      # swallows both, so a broken token produces a green workflow saying
      # nothing happened, which is exactly what a working recorder with nothing
      # to do also produces (L98).
      - name: Re-record the count if the floor has gone slack
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/record_suite_count.py --from-newest-run || [ $? -eq 3 ]

      - name: Say whether the record moved
        id: moved
        run: |
          if git diff --quiet -- tests/fixtures/swift_suite_count.json; then
            echo "moved=false" >> "${GITHUB_OUTPUT}"
          else
            echo "moved=true" >> "${GITHUB_OUTPUT}"
          fi

      # The measurement, kept whatever happens next. A run that computed a new
      # record and could not propose it must not throw the reading away (L277).
      - name: Keep the record this run computed
        if: always() && steps.moved.outputs.moved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swift-suite-count
          path: tests/fixtures/swift_suite_count.json
          if-no-files-found: error

      # A pull request, not a commit to main, so the number arrives as a
      # reviewed change.
      #
      # RECORD_UPDATE_TOKEN rather than the default token, and this is the one
      # thing about this job worth knowing. A pull request opened with
      # GITHUB_TOKEN starts NO workflow runs, so it would carry no checks at
      # all; wait_for_checks.py refuses an empty answer, correctly, so such a
      # pull request could never be merged and this job would produce something
      # nobody can act on.
      #
      # Until that secret exists the job still records, still keeps the
      # artifact, and says so below. Inert is fine; inert and quiet is not
      # (L543).
      - name: Propose the new count
        id: propose
        if: steps.moved.outputs.moved == 'true' && env.RECORD_UPDATE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RECORD_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          # One script, shared with the other recorder. This block used to be
          # copied into both workflows character for character, and the copy
          # carried a push that git refuses on the second run of any day
          # (#1311). Two copies of one rule is two places for it to be wrong.
          # Every outcome, and the reason the push is shaped the way it is,
          # lives in tools/propose_recorded_change.sh.
          tools/propose_recorded_change.sh \
            --record tests/fixtures/swift_suite_count.json \
            --branch-prefix suite-count \
            --title "Record how many tests the Swift suite holds (#1261)" \
            --body "Read off the newest green run of the Swift suite by tools/record_suite_count.py --from-newest-run. Proposed only because the recorded count had fallen more than the floor's own tolerance below what the suite actually runs, so the floor was refusing less than it was designed to."
      # Four outcomes, said apart. Nothing to look at, a record the floor still
      # holds up, a record proposed, and a record that moved with no way to
      # propose it are different events, and only some need anybody to do
      # anything (L11, L98).
      - name: Say what happened
        if: always()
        run: |
          {
            echo "### Swift suite count"
            if [ "${{ steps.record.outcome }}" != "success" ]; then
              echo "The recorder could not reach the runs it reads, so nothing"
              echo "here can say whether the floor has gone slack. Its reason is"
              echo "in the step above; nothing was written or proposed."
            elif [ "${{ steps.moved.outputs.moved }}" != "true" ]; then
              echo "The recorded count still derives a floor within the"
              echo "tolerance of what the suite runs, so there is nothing to"
              echo "propose."
            elif [ -n "${RECORD_UPDATE_TOKEN}" ]; then
              echo "The suite has grown away from the record and a pull request"
              echo "was opened."
            else
              echo "The record moved, and no RECORD_UPDATE_TOKEN is set, so no"
              echo "pull request could be opened. A pull request opened with the"
              echo "default token starts no workflow runs, so it would carry no"
              echo "checks and could never be merged. The new record is attached"
              echo "to this run as the swift-suite-count artifact: download it,"
              echo "commit it and open the pull request by hand, or add the"
              echo "secret and this job will do it next time."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      # A red run here reaches nobody otherwise (#1011).
      #
      # This runs on `workflow_run` and gates nothing. A failure means the recorded suite count stopped being updated, so a run that lost a worker's share of the tests would be waved through as full (L288).
      #
      # It speaks only on a FAILURE. A notice on every green run is what teaches
      # a person to skip the whole list (L36). 
      #
      # A step rather than a job, because a new job is a new CHECK NAME and
      # tests/test_wait_for_checks.py calibrates the names it waits for against
      # a recorded reply from a real pull request (L305).
      - name: Say so if this run went red
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/say_when_ci_goes_red.py \
            --workflow record-suite-count.yml \
            --job "record" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

