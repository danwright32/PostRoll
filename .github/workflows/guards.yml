name: Guard proofs

# Re-running the recorded proof that each guard actually goes red (#541).
#
# The registry holds one entry per guard: a one line perturbation that breaks
# the thing the guard protects, and the test that has to fail when it does.
# `tests/test_guard_mutation_registry.py` runs on every suite and checks the
# cheap half, that every anchor still matches its file exactly once and every
# named test exists. The expensive half, actually applying each perturbation and
# requiring the guard to fail, only ran when somebody typed `make check-guards`.
#
# A guard is only real once it has been seen to fail (L1), so a proof nothing
# re-runs decays into a claim while the registry keeps reporting itself
# consistent. These two jobs are the re-running.
#
# macOS because half the entries perturb Swift and are proved by xcodebuild,
# and macos-26 specifically because that is the image carrying the Xcode that
# PostRollApp/.ci-xcode-version pins. The step selecting it refuses rather than
# falling back to whatever the image ships, which is how this job failed the
# first time it ran on the wrong image: loudly, listing what was there.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly, because the proofs depend on things no commit here touches: the
  # macos-26 runner image, the Xcode that PostRollApp/.ci-xcode-version pins,
  # and Homebrew packages (#551). Any of those can move without a commit, and
  # with the sweep running only on a merge the first sign is a red merge on
  # whatever unrelated change happens to land next, which is the worst moment to
  # meet it and the hardest to attribute.
  #
  # The two known weaknesses of a schedule are recorded rather than pretended
  # away. Its failures are only as visible as GitHub's own email, and GitHub
  # disables a repository's schedules after 60 days with no push, reporting
  # nothing at all rather than reporting that it stopped (L13). Neither is a
  # reason to have no schedule; both are reasons this is the SECOND cadence and
  # not the only one, with the merge sweep still the cadence that gates.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every pull request re-proves the entries its OWN diff touches. Cheap,
  # because a diff usually touches none or one, and it is the half that catches
  # the case that matters most: a guard edited into uselessness in the same
  # change that edits it.
  #
  # ── what it costs, measured 2026-08-20 (#742) ───────────────────────────────
  #
  # "Usually none or one" is true of most diffs and not of the caption review
  # screen, which is where most of the recent work has been. A pull request
  # touching it affected 44 entries at about 29s each: 21 minutes of proving.
  #
  # On top of that, 0 to 22 minutes waiting for a macOS runner before the job
  # starts at all. This repository runs six macOS jobs per pull request and
  # GitHub allows five concurrent macOS runners, so the sixth waits, and with
  # three pull requests open everything does. Measured on 2026-08-20: 2s and 3s
  # of queue with one pull request in flight, 6m51s, 13m45s and 19m11s with
  # three. The queue is the half nothing in this file controls.
  #
  # What drives the entry count is which TEST files a diff touches, not which
  # sources. 31 of the 298 entries name BannerLegibilityTests, so any change to
  # that harness re-proves all 31, and a screen change usually edits its
  # fixture. That is correct, and it is why a screen change costs what it does.
  #
  # Of the three ways #742 proposed to cut it, two are measured dead ends and
  # are recorded here so nobody derives them again:
  #
  # * Reducing what a perturbation rebuilds. #741 split CaptionReviewView.swift
  #   from 5,999 lines into fourteen, and the per-entry time did not move: 18 to
  #   21s before, 18 to 23s after, measured on the entries that moved. The cost
  #   is xcodebuild's fixed overhead plus linking the whole test bundle, not
  #   compiling the file that was perturbed.
  # * A warm cache carried between jobs. The cold first build is about 45s of
  #   the 21 minutes: entry 1 took 72s and the rest took 29s.
  #
  # The third, grouping entries that perturb the same file into one build, is
  # not slow but unsound: each entry is a different perturbation, and a batch
  # big enough to break everything makes every named test fail, which is
  # indistinguishable from the one that should have (L154).
  #
  # What is left costs something real, which is why it is written down rather
  # than done. Sharding this job the way `full` is sharded below buys wall clock
  # by consuming more of the very runners the queue above is short of. Moving
  # the source-scanning colour rules out of the Swift suite and into pytest
  # would take 15 entries off the build entirely, at the price of
  # reimplementing this project's strictest style enforcement, including the
  # matcher controls that are what make those rules trustworthy.
  changed:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # Full history: --changed diffs against the merge base with origin/main,
      # and a shallow checkout has no merge base to find.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select the recorded Xcode
        run: |
          version="$(cat PostRollApp/.ci-xcode-version)"
          app="/Applications/Xcode_${version}.app"
          if [ ! -d "${app}" ]; then
            echo "PostRollApp/.ci-xcode-version asks for Xcode ${version}, which is not"
            echo "on this runner image. What it has:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "${app}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: PostRollApp
        run: xcodegen generate

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Needed to prove any guard whose test renders a reel (#777).
      #
      # Without it those tests SKIP, and check_guards reports ERROR rather than
      # a verdict, which is correct of it and useless as a proof: the guard
      # cannot be registered at all, so the most expensive visual checks in the
      # project are the ones the registry cannot cover. This runner already
      # selects an Xcode and installs XcodeGen, so ffmpeg is a small addition to
      # a job that was never cheap.
      - name: Install ffmpeg
        run: brew install ffmpeg

      # Prints what it skipped and why, because "0 entries affected" is a real
      # answer here and has to be told apart from a run that found nothing to do
      # because it was broken (L98).
      - name: Re-prove the guards this diff touches
        run: python tools/check_guards.py --changed

  # The whole registry, on every merge to main.
  #
  # The pull request leg above re-proves an entry when the code it guards, its
  # own record, or its own test file changes. What it cannot know about is what
  # sits UNDERNEATH those tests: the shared conftest nearly every test imports,
  # or a shared fixture module. A change there can quietly stop a guard failing
  # on broken code while touching neither the guarded file nor the guard's test,
  # so no pull request would re-prove it (L88, a filtered job skipping the very
  # change that breaks it).
  #
  # On merges rather than on a schedule, deliberately. It costs nothing on a day
  # with no merges, it runs within minutes of the shared change actually
  # landing, and a scheduled job has two failure modes this one does not: its
  # failures are only as visible as GitHub's own email, and GitHub disables a
  # repository's schedules after 60 days without a push, which reports nothing
  # at all rather than reporting that it stopped (L13).
  #
  # Measured before choosing, locally: 60 entries proved by xcodebuild at about
  # 13s each with a warm cache and 57 by pytest at under a second, so roughly 15
  # minutes of proving plus one build.
  #
  # Then measured on the runner, which is the number that decides this (#548):
  # 24m57s for 119 entries on the first sweep after a merge, cold.
  #
  # That comment used to end "revisit if the registry roughly doubles, at which
  # point the timeout is the thing that will say so". It doubled, to 280, and on
  # 2026-08-19 the timeout did say so, in the worst available words: a job
  # killed by `timeout-minutes` reports CANCELLED, which is exactly what a
  # superseded run reports, so the sweep had been dying at 60 minutes for hours
  # while the run list read as though somebody had replaced those runs (L11).
  # Every guard in the registry had quietly stopped being re-proved.
  #
  # Two changes, because the timeout and the way it was reported are separate
  # defects and fixing only the first would leave the next capacity wall just as
  # invisible:
  #
  # Split across a matrix, which the old comment had considered and declined as
  # buying wall clock the job did not need. It needs it now. `--shard I/N` puts
  # every entry in exactly one shard and balances the expensive ones, since a
  # Swift entry pays a build and a Python one is under a second; a contiguous
  # split would hand one runner most of the builds. Each shard reports what it
  # did NOT run, so a shard's output cannot be read as a whole sweep.
  #
  # And a deadline INSIDE the tool, under the job's own cap, so running out of
  # time is a failure that names the entries it never reached rather than a
  # cancellation indistinguishable from an interruption.
  #
  # This repository is public, so the standard runners cost nothing and the
  # price is wall clock on a branch nobody is waiting behind, since this runs
  # after the merge rather than before it.
  full:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      # Every shard runs even when one goes red: a red guard on shard 2 must not
      # hide an unproven one on shard 3, and half a verdict is worse than none
      # because it reads like the whole (L73).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select the recorded Xcode
        run: |
          version="$(cat PostRollApp/.ci-xcode-version)"
          app="/Applications/Xcode_${version}.app"
          if [ ! -d "${app}" ]; then
            echo "PostRollApp/.ci-xcode-version asks for Xcode ${version}, which is not"
            echo "on this runner image. What it has:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "${app}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: PostRollApp
        run: xcodegen generate

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same reason as the `changed` job above: a guard whose test renders a
      # reel skips without ffmpeg, and a skip is not a proof (#777).
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Re-prove this shard of the guards
        # The deadline sits well under `timeout-minutes` on purpose. Whichever
        # fires first decides what is reported, and only this one can say which
        # entries went unproven.
        run: python tools/check_guards.py --shard ${{ matrix.shard }}/4 --deadline-seconds 1800

      # Whether the SCHEDULED sweep is still happening at all (#554). The weekly
      # trigger's failure mode is silence: GitHub disables a repository's
      # schedules after 60 days with no push and reports that nowhere, so
      # without this the guards could stop being re-proved with nothing saying
      # so.
      #
      # `always()` on purpose. This is an independent check that happens to
      # share a job, and letting a red sweep above it skip the question of
      # whether the schedule is alive would make the two failures hide each
      # other (L73).
      #
      # On ONE shard, because the sweep became a matrix and the question is
      # about the workflow rather than about any shard: asked on all four it
      # would be answered four times. It was briefly its own job instead, which
      # is tidier and wrong: a new job is a new CHECK NAME, and
      # tests/test_wait_for_checks.py calibrates the checks it waits for against
      # a RECORDED reply from a real pull request. Adding a name to the
      # workflows without a new recording would have meant hand-editing that
      # fixture, and a fixture edited to match the thing it is meant to verify
      # is no longer evidence of anything (L48, L58).
      - name: Say whether the scheduled sweep is still running
        if: always() && matrix.shard == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_guard_sweep_freshness.py

      # How long each CI job has been taking, compared against itself (#1019).
      #
      # Nothing read its own duration over time, so the Swift step's median
      # moved 11% in the week of 2026-08-22 and the guard sweep drifted to
      # within a few entries of its own deadline, both found by an audit rather
      # than by anything running. This is also the instrument #991 and #992 are
      # judged by, which is why it lands ahead of them (L309).
      #
      # Here, on one shard, for exactly the reason written above the step it
      # sits beside: a new job is a new CHECK NAME, and adding one costs a
      # knowingly red merge. Same placement, same reason.
      #
      # It warns and never gates. A job getting slower does not make the change
      # being merged wrong, and failing a run for it is how a check teaches
      # everyone to bypass it (L36).
      - name: Say whether any CI job's duration has moved
        if: always() && matrix.shard == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in swift.yml tests.yml guards.yml; do
            python tools/check_job_durations.py --workflow "${workflow}"
          done
