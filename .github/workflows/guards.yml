name: Guard proofs

# Re-running the recorded proof that each guard actually goes red (#541).
#
# The registry holds one entry per guard: a one line perturbation that breaks
# the thing the guard protects, and the test that has to fail when it does.
# `tests/test_guard_mutation_registry.py` runs on every suite and checks the
# cheap half, that every anchor still matches its file exactly once and every
# named test exists. The expensive half, actually applying each perturbation and
# requiring the guard to fail, only ran when somebody typed `make check-guards`.
#
# A guard is only real once it has been seen to fail (L1), so a proof nothing
# re-runs decays into a claim while the registry keeps reporting itself
# consistent. These two jobs are the re-running.
#
# macOS because half the entries perturb Swift and are proved by xcodebuild,
# and macos-26 specifically because that is the image carrying the Xcode that
# PostRollApp/.ci-xcode-version pins. The step selecting it refuses rather than
# falling back to whatever the image ships, which is how this job failed the
# first time it ran on the wrong image: loudly, listing what was there.

on:
  pull_request:
    branches: [main]
  # Daily, rather than on every push to main (#989).
  #
  # The full sweep used to run on every merge. Measured over the two weeks to
  # 2026-08-30 that was 3,079 of this repository's 6,207 macOS runner-minutes,
  # 50% of them, spent on a job nobody waits for: it runs AFTER the merge, and
  # the entries a merge touched were already proved on the pull request by the
  # `changed` job below. GitHub allows five concurrent macOS runners and a pull
  # request here asks for six, so those minutes came out of the queue every pull
  # request sits in. Median pull request wall clock over the same window was
  # 22.4 minutes against a longest single job of 11.1, so more than eight of
  # those minutes were spent waiting for a runner this job was holding.
  #
  # What the merge cadence bought was the same tree re-proved within minutes
  # instead of within a day, on a warning nobody reads at either cadence. What
  # it cost was every pull request in flight.
  #
  # ONE cron rather than the daily-plus-weekly pair the issue proposed. The
  # weekly run existed because the proofs depend on things no commit here
  # touches: the macos-26 runner image, the Xcode PostRollApp/.ci-xcode-version
  # pins, and Homebrew packages (#551). That is now the gate's own staleness
  # window, so it is one rule in one place instead of two cadences that have to
  # agree about which of them covers what (L41).
  #
  # The two known weaknesses of a schedule are recorded rather than pretended
  # away. Its failures are only as visible as GitHub's own email, and GitHub
  # disables a repository's schedules after 60 days with no push, reporting
  # nothing at all rather than reporting that it stopped (L13). Both are why the
  # step below asks out loud whether the sweep is still happening, and why since
  # #989 that question counts runs that PROVED something rather than runs that
  # finished: the sweep's own steps are conditional now, so a run that skipped
  # still concludes success and would otherwise read as a healthy schedule for
  # as long as it lasted (L106).
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every pull request re-proves the entries its OWN diff touches. Cheap,
  # because a diff usually touches none or one, and it is the half that catches
  # the case that matters most: a guard edited into uselessness in the same
  # change that edits it.
  #
  # ── what it costs, measured 2026-08-20 (#742) ───────────────────────────────
  #
  # "Usually none or one" is true of most diffs and not of the caption review
  # screen, which is where most of the recent work has been. A pull request
  # touching it affected 44 entries at about 29s each: 21 minutes of proving.
  #
  # On top of that, 0 to 22 minutes waiting for a macOS runner before the job
  # starts at all. This repository runs six macOS jobs per pull request and
  # GitHub allows five concurrent macOS runners, so the sixth waits, and with
  # three pull requests open everything does. Measured on 2026-08-20: 2s and 3s
  # of queue with one pull request in flight, 6m51s, 13m45s and 19m11s with
  # three. The queue is the half nothing in this file controls.
  #
  # What drives the entry count is which TEST files a diff touches, not which
  # sources. 31 of the 298 entries name BannerLegibilityTests, so any change to
  # that harness re-proves all 31, and a screen change usually edits its
  # fixture. That is correct, and it is why a screen change costs what it does.
  #
  # Of the three ways #742 proposed to cut it, two are measured dead ends and
  # are recorded here so nobody derives them again. Every second below was read
  # off this sweep's own runs on the macos-26 runner, not off the 12 core Mac
  # this repo is written on, and those two differ by 4x in cores (#1245):
  #
  # * Reducing what a perturbation rebuilds. #741 split CaptionReviewView.swift
  #   from 5,999 lines into fourteen, and the per-entry time did not move: 18 to
  #   21s before, 18 to 23s after, measured on the entries that moved. The cost
  #   is xcodebuild's fixed overhead plus linking the whole test bundle, not
  #   compiling the file that was perturbed.
  # * A warm cache carried between jobs. The cold first build is about 45s of
  #   the 21 minutes: entry 1 took 72s and the rest took 29s.
  #
  # The third, grouping entries that perturb the same file into one build, is
  # not slow but unsound: each entry is a different perturbation, and a batch
  # big enough to break everything makes every named test fail, which is
  # indistinguishable from the one that should have (L154).
  #
  # What is left costs something real, which is why it is written down rather
  # than done. Sharding this job the way `full` is sharded below buys wall clock
  # by consuming more of the very runners the queue above is short of. Moving
  # the source-scanning colour rules out of the Swift suite and into pytest
  # would take 15 entries off the build entirely, at the price of
  # reimplementing this project's strictest style enforcement, including the
  # matcher controls that are what make those rules trustworthy.
  changed:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    # Above the 900s deadline plus this job's setup (Xcode, xcodegen, pip,
    # ffmpeg: about five minutes), so the DEADLINE is what fires and the cap is
    # only there for a hang. Whichever fires first decides what is reported, and
    # only the deadline can say which entries went unproven (L110, L313).
    timeout-minutes: 30
    steps:
      # Full history: --changed diffs against the merge base with origin/main,
      # and a shallow checkout has no merge base to find.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Shared with swift.yml and ui.yml (#1249).
      - name: Prepare the Mac build
        uses: ./.github/actions/prepare-mac-build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Needed to prove any guard whose test renders a reel (#777).
      #
      # Without it those tests SKIP, and check_guards reports ERROR rather than
      # a verdict, which is correct of it and useless as a proof: the guard
      # cannot be registered at all, so the most expensive visual checks in the
      # project are the ones the registry cannot cover. This runner already
      # selects an Xcode and installs XcodeGen, so ffmpeg is a small addition to
      # a job that was never cheap.
      - name: Install ffmpeg
        run: brew install ffmpeg

      # Prints what it skipped and why, because "0 entries affected" is a real
      # answer here and has to be told apart from a run that found nothing to do
      # because it was broken (L98).
      #
      # ── the deadline, and who it blocks (#1086) ─────────────────────────────
      #
      # This job had no deadline at all: a wide diff either finished or was
      # killed by `timeout-minutes` 45 minutes later with nothing saying what it
      # reached, and a job killed by the cap reports CANCELLED, which is what a
      # superseded run reports too (L11).
      #
      # 900s, chosen from the distribution rather than picked round (L172).
      # Every duration below is this job's OWN, on the macos-26 runner it asks
      # for, not a reading from the 12 core Mac this repo is written on (#1245).
      # Measured over 28 runs: 165s median, 393s at p90, 1,511s at worst. So it
      # is 2.3x p90 and fires only on the wide diffs that were actually the
      # problem: over 2026-08-30 and 31 this job was the SOLE thing holding five
      # separate merges, for 15 to 19 minutes each, with every other check green,
      # and #1072 waited 1,140s on it alone.
      #
      # What it does when it fires is the decision this issue carried. An
      # unreached entry FAILS the run only when this diff EDITED that guard,
      # meaning its test file or its own registry record changed: a guard edited
      # into uselessness in the same change that edits it is the case this job
      # exists to catch. An entry selected only because the guarded FILE moved is
      # named and warned about, because failing there turns a wide diff into a
      # blocked merge, and #989's daily sweep re-proves every entry within a day
      # either way.
      - name: Re-prove the guards this diff touches
        run: python tools/check_guards.py --changed --deadline-seconds 900

  # The whole registry, on every merge to main.
  #
  # The pull request leg above re-proves an entry when the code it guards, its
  # own record, or its own test file changes. What it cannot know about is what
  # sits UNDERNEATH those tests: the shared conftest nearly every test imports,
  # or a shared fixture module. A change there can quietly stop a guard failing
  # on broken code while touching neither the guarded file nor the guard's test,
  # so no pull request would re-prove it (L88, a filtered job skipping the very
  # change that breaks it).
  #
  # Once a day, on any day main moved (#989). It used to run on every merge, on
  # the argument that a schedule costs nothing on a quiet day and reports its
  # own failures only by email. Both halves of that still hold and neither was
  # worth what the merge cadence cost: half of every macOS runner-minute this
  # repository spends, taken out of the queue that every pull request waits in.
  # The email weakness is answered by the freshness step at the foot of this
  # job, which is the same answer it always was.
  #
  # A quiet day still costs nothing, because the first step of each shard asks
  # whether this exact tree has already been proved by this exact shard and the
  # rest of the shard runs only if it has not. Every answer that is not a
  # positive proof runs the sweep: an unproved tree, a proof older than the
  # window, and a run history that could not be read at all. The direction that
  # costs money is a sweep that runs when it could have skipped; the direction
  # that costs coverage is a sweep that skips when it should have run, and that
  # one is silent (L98).
  #
  # Measured before choosing, locally: 60 entries proved by xcodebuild at about
  # 13s each with a warm cache and 57 by pytest at under a second, so roughly 15
  # minutes of proving plus one build.
  #
  # Then measured on the runner, which is the number that decides this (#548):
  # 24m57s for 119 entries on the first sweep after a merge, cold.
  #
  # That comment used to end "revisit if the registry roughly doubles, at which
  # point the timeout is the thing that will say so". It doubled, to 280, and on
  # 2026-08-19 the timeout did say so, in the worst available words: a job
  # killed by `timeout-minutes` reports CANCELLED, which is exactly what a
  # superseded run reports, so the sweep had been dying at 60 minutes for hours
  # while the run list read as though somebody had replaced those runs (L11).
  # Every guard in the registry had quietly stopped being re-proved.
  #
  # Two changes, because the timeout and the way it was reported are separate
  # defects and fixing only the first would leave the next capacity wall just as
  # invisible:
  #
  # Split across a matrix, which the old comment had considered and declined as
  # buying wall clock the job did not need. It needs it now. `--shard I/N` puts
  # every entry in exactly one shard and balances the expensive ones, since a
  # Swift entry pays a build and a Python one is under a second; a contiguous
  # split would hand one runner most of the builds. Each shard reports what it
  # did NOT run, so a shard's output cannot be read as a whole sweep.
  #
  # And a deadline INSIDE the tool, under the job's own cap, so running out of
  # time is a failure that names the entries it never reached rather than a
  # cancellation indistinguishable from an interruption.
  #
  # This repository is public, so the standard runners cost nothing and the
  # price is wall clock on a branch nobody is waiting behind, since this runs
  # after the merge rather than before it.
  full:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      # Every shard runs even when one goes red: a red guard on shard 2 must not
      # hide an unproven one on shard 3, and half a verdict is worse than none
      # because it reads like the whole (L73).
      fail-fast: false
      matrix:
        # Six since #989's second half. Four shards ran at 98% and 99% of the
        # 1800s deadline on the first sweep after the cadence changed, over 469
        # entries, on the macos-26 runner this job asks for (#1245), and the
        # registry has grown to 495 since: the projection at
        # four is 1,882s, past the deadline, so the next sweep would have
        # reported entries UNPROVEN while going green (L98).
        #
        # More shards rather than better dealing, decided on the measurement.
        # The four shards came in at 1,783s against a mean of 1,686s, an
        # imbalance of 1.06, so dealing entries by measured time rather than by
        # cost class is worth about a hundred seconds and the total is what
        # grew. tests/test_guard_sweep_fits_its_deadline.py holds both halves of
        # that and goes red if either stops being true.
        #
        # Seven asks for two more macOS runners than GitHub runs at once, so two
        # shards wait for a slot. That was the objection to sharding recorded
        # above, and it is much weaker here than it was on the merge path: this
        # is a daily 07:00 job nobody waits on, the deadline is measured inside
        # the step rather than from when the job was queued, and the price is
        # wall clock on a run whose result is read the next day.
        #
        # Was six until 2026-09-02, when the registry reached 603 entries and
        # `test_the_largest_shard_is_projected_well_inside_its_deadline` went
        # red at exactly 80% of the 1800s deadline. The split was balanced to
        # 1.00x, so it was the TOTAL that had grown, and the remedy that test
        # names is a shard rather than a wider share. Seven brings the largest
        # shard to about 69%. Do not widen the share instead: a shard that runs
        # out of time reports its remaining entries as UNPROVEN while the
        # workflow still goes green (L98, L315).
        shard: [1, 2, 3, 4, 5, 6, 7]
    # Enough to file the one issue this job opens when it goes red (#1011).
    #
    # At JOB level rather than on the step, because a step's own `permissions:`
    # is not a thing GitHub honours: writing it there reads as a restriction and
    # applies none.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Ungated, along with the Python setup below it, because the two reporting
      # steps at the foot of this job need them whatever the sweep decides. They
      # are about twenty seconds, which is what a day with no merges costs here.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Does this shard still have anything to prove? (#989)
      #
      # A step rather than a job on purpose. A new job is a new CHECK NAME, and
      # tools/wait_for_checks.py derives the bar a pull request has to clear
      # from these workflow files, calibrated against a recorded reply from a
      # real green pull request. Adding a name means a run carrying it can only
      # be green once the fixture already holds it, so there is no green run to
      # record from and breaking the loop costs a knowingly red merge (L48).
      # The same reason the two steps at the foot of this job are steps.
      - name: Say whether this shard still has anything to prove
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_guard_sweep_due.py --shard ${{ matrix.shard }}

      # Shared with swift.yml and ui.yml (#1249). The `if:` stays HERE: it is
      # what keeps a quiet day from paying for the whole setup, and it reads a
      # step of THIS job.
      - name: Prepare the Mac build
        if: steps.due.outputs.due == 'true'
        uses: ./.github/actions/prepare-mac-build

      - name: Install dependencies
        if: steps.due.outputs.due == 'true'
        run: pip install -r requirements.txt

      # Same reason as the `changed` job above: a guard whose test renders a
      # reel skips without ffmpeg, and a skip is not a proof (#777).
      - name: Install ffmpeg
        if: steps.due.outputs.due == 'true'
        run: brew install ffmpeg

      - name: Re-prove this shard of the guards
        if: steps.due.outputs.due == 'true'
        # The deadline sits well under `timeout-minutes` on purpose. Whichever
        # fires first decides what is reported, and only this one can say which
        # entries went unproven.
        #
        # `--timings` writes what each entry cost (#1090). That record is what
        # `shard_of` deals by and what
        # tests/test_guard_sweep_fits_its_deadline.py projects the largest shard
        # from, and until #1090 nothing measured it: the number that sized the
        # deadline had to be reversed out of one sweep, on the macos-26
        # runner, as 14.4s averaged over 469 entries, which hides a spread of
        # 90x (#1245).
        run: |
          python tools/check_guards.py --shard ${{ matrix.shard }}/7 --deadline-seconds 1800 \
            --timings guard-timings-${{ matrix.shard }}.json

      # Uploaded rather than committed, because a scheduled job pushing to main
      # is a write nobody reviewed, and because the readings are only worth
      # folding in when a sweep completed: a shard that hit its deadline
      # measured the entries it reached and nothing about the ones it did not,
      # and recording that as the sweep's cost would price the registry from
      # its cheap half (L331).
      #
      # `always()` so a shard that went red still surrenders what it measured.
      # A red guard is a real verdict about one entry, not a reason to throw
      # away the timings of the other eighty.
      - name: Keep this shard's timings
        if: always() && steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guard-timings-${{ matrix.shard }}
          path: guard-timings-${{ matrix.shard }}.json
          if-no-files-found: warn

      # Whether the SCHEDULED sweep is still happening at all (#554). The weekly
      # trigger's failure mode is silence: GitHub disables a repository's
      # schedules after 60 days with no push and reports that nowhere, so
      # without this the guards could stop being re-proved with nothing saying
      # so.
      #
      # `always()` on purpose. This is an independent check that happens to
      # share a job, and letting a red sweep above it skip the question of
      # whether the schedule is alive would make the two failures hide each
      # other (L73).
      #
      # On ONE shard, because the sweep became a matrix and the question is
      # about the workflow rather than about any shard: asked on all four it
      # would be answered four times. It was briefly its own job instead, which
      # is tidier and wrong: a new job is a new CHECK NAME, and
      # tests/test_wait_for_checks.py calibrates the checks it waits for against
      # a RECORDED reply from a real pull request. Adding a name to the
      # workflows without a new recording would have meant hand-editing that
      # fixture, and a fixture edited to match the thing it is meant to verify
      # is no longer evidence of anything (L48, L58).
      - name: Say whether the scheduled sweep is still running
        if: always() && matrix.shard == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_guard_sweep_freshness.py

      # How long each CI job has been taking, compared against itself (#1019).
      #
      # Nothing read its own duration over time, so the Swift step's median
      # moved 11% in the week of 2026-08-22 and the guard sweep drifted to
      # within a few entries of its own deadline, both found by an audit rather
      # than by anything running. This is also the instrument #991 and #992 are
      # judged by, which is why it lands ahead of them (L309).
      #
      # Here, on one shard, for exactly the reason written above the step it
      # sits beside: a new job is a new CHECK NAME, and adding one costs a
      # knowingly red merge. Same placement, same reason.
      #
      # It warns and never gates. A job getting slower does not make the change
      # being merged wrong, and failing a run for it is how a check teaches
      # everyone to bypass it (L36).
      - name: Say whether any CI job's duration has moved
        if: always() && matrix.shard == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in swift.yml tests.yml guards.yml; do
            python tools/check_job_durations.py --workflow "${workflow}"
          done

      # A red run here reaches nobody otherwise (#1011).
      #
      # This job carries a condition excluding pull requests, so it runs on push to main AFTER the merge has landed, and on the weekly schedule with no push behind it at all. Neither gates anything, so a failure is a guard already dead on main. That is how the whole registry stopped being re-proved for hours on 2026-08-19 (L13).
      #
      # On EVERY shard, unlike the two steps above it, which ask a question about the workflow and have one answer. This REPORTS a failure, and shard 3 going red while shard 1 is green is exactly the case that must not be silent.
      #
      # It speaks only on a FAILURE. A notice on every green run is what teaches
      # a person to skip the whole list (L36). 
      #
      # A step rather than a job, because a new job is a new CHECK NAME and
      # tests/test_wait_for_checks.py calibrates the names it waits for against
      # a recorded reply from a real pull request (L305).
      - name: Say so if this run went red
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/say_when_ci_goes_red.py \
            --workflow guards.yml \
            --job "full (${{ matrix.shard }})" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

